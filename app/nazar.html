  /* ------------------------------------------------- scene animation */
  /* Nothing on the board is ever cut in half. A card keeps its speaker row: when space is
     short the quote gives up whole lines (5 -> 2 on #1, 3 -> 2 on #2), then the AI summary
     goes. The list shows only the rows that fit completely. */
  function fitAttackCards(el, again) {
    if (PHONE) return;                                        // phone: everything stacks and the page scrolls
    /* web fonts can arrive after the first paint and make text taller: measure again then */
    if (!again) {
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitAttackCards(el, true); });
      state.tmo.push(setTimeout(function () { fitAttackCards(el, true); }, 700));
    }
    [].forEach.call(el.querySelectorAll('.ak-c'), function (c) {
      var q = c.querySelector('.ak-q'), s = c.querySelector('.ak-s'), lead = c.className.indexOf('ak-lead') >= 0;
      q.style.webkitLineClamp = ''; if (s) s.style.display = '';
      function over() { return c.scrollHeight > c.clientHeight + 1; }
      for (var n = lead ? 5 : 3; n > 2 && over(); n--) q.style.webkitLineClamp = String(n - 1);
      if (over() && s) s.style.display = 'none';
    });
    var L = el.querySelector('.ak-l'); if (!L) return;
    var rows = L.querySelectorAll('.ak-row'), note = L.querySelector('.ak-note');
    [].forEach.call(rows, function (r) { r.style.display = ''; });
    var limit = L.getBoundingClientRect().bottom - (note ? note.offsetHeight : 0);
    [].forEach.call(rows, function (r) { if (r.getBoundingClientRect().bottom > limit + 1) r.style.display = 'none'; });
  }

      if (REDUCED || !isFinite(to)) { n.innerHTML = numHtml(f(to)); return; }
      /* progress follows the clock, not the frame count, and once the final value
         is written nothing can overwrite it -- so a TV that drops frames still ends
         on the right number */
      var t0 = Date.now(), D = 1400, done = false;
      var finish = function () { done = true; n.innerHTML = numHtml(f(to)); };
      var step = function () {
        if (done) return;
        var k = Math.min(1, (Date.now() - t0) / D);
        if (k >= 1) { finish(); return; }
        n.innerHTML = numHtml(f(Math.round(to * (1 - Math.pow(1 - k, 3)))));
        state.raf.push(requestAnimationFrame(step));

      if (!g || introDone) return;
      var vb = String(g.viewBox).split(/[\s,]+/).map(Number), y0 = vb[1], y1 = vb[1] + vb[3];
      var p = '<defs><linearGradient id="inTri" gradientUnits="userSpaceOnUse" x1="0" y1="' + y0 + '" x2="0" y2="' + y1 + '">' +
        '<stop offset="0" stop-color="#FF9933"/><stop offset=".3" stop-color="#FF9933"/><stop offset=".5" stop-color="#FFFFFF"/>' +
        '<stop offset=".7" stop-color="#138808"/><stop offset="1" stop-color="#138808"/></linearGradient></defs>';
      Object.keys(g.states).forEach(function (k) { p += '<path pathLength="1" d="' + g.states[k] + '"' + (k === STATE ? ' class="sel"' : '') + '></path>'; });
      $('inMap').setAttribute('viewBox', g.viewBox); $('inMap').innerHTML = p;
      /* the chosen state sits on top so its outline is not hidden by its neighbours */
      var sel = $('inMap').querySelector('path.sel'); if (sel) sel.parentNode.appendChild(sel);
      /* light spreads from the heart of India outward: each state starts by its distance from the centre */
      var cx = vb[0] + vb[2] / 2, cy = vb[1] + vb[3] / 2, R = Math.sqrt(vb[2] * vb[2] + vb[3] * vb[3]) / 2;
      [].forEach.call($('inMap').querySelectorAll('path'), function (el) {
        var d = 0; try { var b = el.getBBox(), dx = b.x + b.width / 2 - cx, dy = b.y + b.height / 2 - cy; d = Math.sqrt(dx * dx + dy * dy) / R; } catch (e) {}
        var at = REDUCED ? 0 : 0.3 + Math.min(1, d) * 1.3;
        el.style.animationDelay = at.toFixed(2) + 's, 2.3s';
      });
    });
    if (REDUCED) { state.tmo.push(setTimeout(introStats, 300)); setTimeout(endIntro, 3500); return; }
    /* pollen: 18 sparks + 8 small petals thrown out of the flower when it opens */
    h = '';
    for (i = 0; i < 26; i++) {
      var pe = i >= 18, a = (pe ? (i - 18) * 45 + 20 : i * 20) + Math.random() * 12, k = 0.55 + Math.random() * 0.6;
      h += '<i style="-webkit-transform:rotate(' + a.toFixed(0) + 'deg) scale(' + k.toFixed(2) + ');transform:rotate(' + a.toFixed(0) + 'deg) scale(' + k.toFixed(2) + ')">' +
        '<b class="' + (pe ? 'pe' : '') + '" style="animation-delay:' + (3.65 + Math.random() * 0.25).toFixed(2) + 's;animation-duration:' + (pe ? 2.4 : 1.5 + Math.random() * 0.5).toFixed(2) + 's"></b></i>';
    }
    $('inBurst').innerHTML = h;
    /* embers drifting up behind everything once the flower has opened */
    h = '';
    for (i = 0; i < 18; i++) {
      h += '<i style="left:' + (4 + Math.random() * 92).toFixed(1) + '%;animation-duration:' + (7 + Math.random() * 6).toFixed(1) + 's;animation-delay:' +
        (3.4 + Math.random() * 4).toFixed(1) + 's;width:' + (0.25 + Math.random() * 0.4).toFixed(2) + 'rem;height:' + (0.25 + Math.random() * 0.4).toFixed(2) + 'rem"></i>';
    }
    $('inEmbers').innerHTML = h;
    state.tmo.push(setTimeout(introStats, 6100));
    setTimeout(endIntro, 9200);
  }
  function rayPt(deg) { var r = deg * Math.PI / 180; return (100 + 100 * Math.sin(r)).toFixed(2) + ',' + (100 - 100 * Math.cos(r)).toFixed(2); }
  function introStats() {
    if (introDone || !state.all) return;
    var cs = state.all.coverageStats || {}, k = state.all.kpis || {};
    var items = [[fmtInt(cs.handlesMapped), t('intro1')], [STATE ? '' : String(k.statesCovered || ''), t('intro2')], [fmtShort(cs.postsInDatabase), t('intro3')]]
      .filter(function (x) { return x[0] && x[0] !== '–'; });
    $('inStats').innerHTML = items.map(function (x, i) { return '<div class="in-stat" style="animation-delay:' + (i * 0.35) + 's"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>'; }).join('');
  }
  function endIntro() {
    if (introDone) return; introDone = true;
    try { window.sessionStorage.setItem('nazar_intro', '1'); } catch (e) {}
    $('intro').className = 'gone';
    setTimeout(function () { $('intro').style.display = 'none'; }, 900);
    var cb = introCb; introCb = null; if (cb && !state.stopped) cb();
  }

  /* -------------------------------------------------------- controls */
  var idleT = null;
  function wake() {
    if (KIOSK) return;
    setCls(document.body, 'idle', false);
    if (state.mode) $('ctl').className = 'ctl on';
    clearTimeout(idleT);
    idleT = setTimeout(function () { $('ctl').className = 'ctl'; setCls(document.body, 'idle', true); }, 3000);
  }
  function fullscreen() {
    var d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    var f = el.requestFullscreen || el.webkitRequestFullscreen; if (f) { try { f.call(el); } catch (e) {} }
  }
  function goBack() {
    var home = SCOPE === 'up' ? '/up' : '/', ref = document.referrer || '';
    if (ref.indexOf(location.origin) === 0 && ref.indexOf('/live') < 0 && ref.indexOf('/tv') < 0 && history.length > 1) history.back(); else location.href = home;
  }
  function toggleLang() { LANG = LANG === 'en' ? 'hi' : 'en'; store('pulse_live_lang', LANG); applyLang(); if (chRes.length) renderList(); }

  $('cPrev').onclick = function () { show(state.idx - 1); wake(); };
  $('cNext').onclick = function () { show(state.idx + 1); wake(); };
  $('cPlay').onclick = function () { pause(!state.paused); wake(); };
  $('cFull').onclick = function () { fullscreen(); wake(); };
  $('langBtn').onclick = toggleLang; $('chLang').onclick = function () { holdChooser(); toggleLang(); };
  $('backBtn').onclick = goBack; $('chBack').onclick = goBack;
  $('swBtn').onclick = function () { openChooser(); };
  $('mrBtn').onclick = function () { if (state.mode === 'media') pause(!MR.open); wake(); };
  $('mrpX').onclick = function () { pause(false); };
  document.addEventListener('mousemove', wake);
  var tx = null;
  document.addEventListener('touchstart', function (e) { wake(); holdForReading(e); tx = e.touches && e.touches[0] ? e.touches[0].clientX : null; }, { passive: true });
  window.addEventListener('scroll', holdForReading, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!state.mode || MR.open || tx === null || !e.changedTouches || !e.changedTouches[0]) return;
    var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 60) show(state.idx + (dx < 0 ? 1 : -1));
  }, { passive: true });
  document.addEventListener('keydown', function (e) {
    if (!introDone) { endIntro(); return; }
    if (!state.mode) return;
    if (MR.open) { mrKey(e); return; }
    var k = e.key || '';
    if ((k === 'm' || k === 'M') && state.mode === 'media') pause(true);
    else if (k === 'ArrowRight' || k === 'Right' || k === 'MediaTrackNext') show(state.idx + 1);
    else if (k === 'ArrowLeft' || k === 'Left' || k === 'MediaTrackPrevious') show(state.idx - 1);
    else if (k === ' ' || k === 'Spacebar' || k === 'MediaPlayPause' || k === 'Enter') { if (k === 'Enter' && e.target && e.target.tagName === 'BUTTON') return; pause(!state.paused); e.preventDefault(); }
    else if (k === 'f' || k === 'F') fullscreen();
    else if (k === 'l' || k === 'L') toggleLang();
    else return;
    wake();
  });
  $('intro').addEventListener('click', endIntro);

  /* ---------------------------------------- run-for-days housekeeping */
  var wakeLock = null;
  function keepAwake() {
    try { if (navigator.wakeLock && document.visibilityState === 'visible' && !wakeLock) navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; l.addEventListener('release', function () { wakeLock = null; }); }).catch(function () {}); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { keepAwake(); if (state.mode && !state.stopped && Date.now() - state.lastOk > REFRESH_MS) { clearTimeout(fetchTimer); fetchData(); } }
  });
  function softReload() {
    if (state.stopped) return;
    if (!DEMO && Date.now() - state.lastOk > 3 * 60000) { setTimeout(softReload, 10 * 60000); return; }
    if (!state.mode) { setTimeout(softReload, 10 * 60000); return; }      // never reload in the middle of a choice
    location.reload();
  }

  /* ---------------------------------------------------------- demo */
  function demoSnap() {
    var P = [['BJP', '#E65100', 6100, 1.31e7, 1150, 1800], ['INC', '#1565C0', 820, 3.9e6, 230, 430], ['AAP', '#00838F', 240, 1.7e6, 80, 110], ['SP', '#E41E24', 170, 1.5e6, 50, 120], ['TDP', '#FF8F00', 230, 2.1e5, 80, 125]];
    var parties = P.map(function (x) {
      return { party: x[0], color: x[1], posts: x[2], views: x[3], postShare: Math.round(1000 * x[2] / 7560) / 10, viewShare: Math.round(1000 * x[3] / 2.05e7) / 10,
               accounts: { mapped: null, collected: x[5], active: x[4] }, postsPerCollected: Math.round(100 * x[2] / x[5]) / 100, viewsPerCollected: Math.round(x[3] / x[5]), limited: false, logo: null };
    });
    parties.push({ party: 'Others', color: '#546E7A', posts: 900, views: 3.6e6, postShare: null, viewShare: null, accounts: {}, postsPerCollected: null, viewsPerCollected: null, parts: 24 });
    var lead = {}; P.forEach(function (x) { lead[x[0]] = [1, 2, 3].map(function (n) { return { handle: 'sample' + n, name: 'Sample Leader ' + x[0] + ' ' + n, state: 'Uttar Pradesh', posts: 5 - n, views: 900000 / n, avatar: null }; }); });
    return { scope: SCOPE, mode: 'demo', generatedAt: new Date().toISOString(),
      status: { level: 'recent', label: 'latest', newestPostAt: '2026-10-18 23:59:00 IST', newestAgeMin: null, lastPushAt: null, pipeline: null },
      window: { mode: 'lastFullDay', from: '2026-10-18 00:00:00 IST', to: '2026-10-18 23:59:59 IST', day: '2026-10-18' },
      coverage: { estimated: true, ratio: 0.8 }, kpis: { originalPosts: 8460, views: 2.4e7, accounts: 1900, statesCovered: 26 },
      excluded: { media: 4300, retweets: 6200, noParty: 80, noState: 380 }, parties: parties, leadersByParty: lead,
      states: [['Uttar Pradesh', 1700, 'BJP', '#E65100'], ['Maharashtra', 900, 'BJP', '#E65100'], ['Gujarat', 630, 'BJP', '#E65100'], ['Punjab', 300, 'AAP', '#00838F'], ['Karnataka', 280, 'INC', '#1565C0'], ['Delhi', 240, 'AAP', '#00838F']]
        .map(function (x) { return { state: x[0], posts: x[1], leadParty: x[2], color: x[3], limited: false }; }),
      topPost: { name: 'Sample Leader BJP 1', party: 'BJP', state: 'Uttar Pradesh', views: 980000, date: '2026-10-18 09:12:00 IST', text: 'This is sample text for the demo view. It shows how the most-viewed post of the period will appear on screen.' },
      breakout: [{ name: 'Sample Leader SP 1', party: 'SP', state: 'Uttar Pradesh', ratio: 4.5, recentMedian: 460000, baseMedian: 103000, basePosts: 104 }],
      compare: { comparable: true, prevPosts: 9000 },
      ticker: [{ head: 'Sample headline one for the demo ticker', src: 'Sample Channel', date: '2026-10-18 21:00:00 IST', topic: 'Politics' }, { head: 'Sample headline two, another media update', src: 'Sample News', date: '2026-10-18 20:10:00 IST', topic: 'Governance' }],
      facts: [{ type: 'window_posts', posts: 8460, accounts: 1900 }, { type: 'top_state', state: 'Uttar Pradesh', posts: 1700 }],
      coverageStats: { handlesMapped: 5200, postsInDatabase: 2778000 } };
  }

  /* ----------------------------------------------------------- start */
  if (KIOSK) document.body.className += ' kiosk';
  if (PROTO) document.body.className += ' proto';
  if (REDUCED) document.body.className += ' reduced';
  setupHero(); scale();
  window.addEventListener('resize', function () { clearTimeout(scale.t); scale.t = setTimeout(scale, 150); });
  /* some TVs never fire "resize": look every 2 s (scale() does nothing when the size is the same) */
  setInterval(function () { scale(); }, 2000);
  window.addEventListener('orientationchange', function () { setTimeout(function () { scale(true); }, 300); });
  applyLang(); renderClock(); setInterval(renderClock, 10000); keepAwake();
  heroLevel('hi'); $('app').style.visibility = 'hidden';
  /* the intro shows real numbers, so fetch the All-India snapshot while it plays */
  if (!DEMO) api('/api/live-snapshot' + q()).then(function (j) { if (j && !j.__notfound) { state.all = j; introStats(); } }).catch(function () {});
  else state.all = demoSnap();
  /* the Media Room's news too, a moment later, so it opens at once when chosen (api() keeps it 25 s;
     after that the browser cache is gone but the server answers from its ready copy) */
  if (!DEMO) setTimeout(function () { api(mrUrl()).catch(function () {}); }, 1200);
  playIntro(function () {
    if (Q.h) startShow('person', Q.h);
    else if (Q.mode === 'media') startShow('media');
    else if (KIOSK || Q.mode === 'all' || DEMO) startShow('all');
    else openChooser();
  });
  if (!DEMO) setTimeout(softReload, SOFT_RELOAD_MS);
})();
