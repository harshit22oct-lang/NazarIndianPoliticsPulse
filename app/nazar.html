   ("विधायक" lost the top of its ि). Room above and below inside the box, taken back outside it,
   so nothing around moves. */
.bj-c b,.ak-who b,.ak-row .n b,.mr-who b,.mr-sh b,.kpi-v.txt{padding-top:.22em;padding-bottom:.14em;margin-top:-.22em;margin-bottom:-.14em}
.ln{line-height:1.3}
.er-cand .nm{line-height:1.4}
/* ---------- frame (audit phase 2: C1-C8) ---------- */
/* C1 one settings button (period · speed · language) instead of two toggles and a language button */
.set-btn{display:flex;align-items:center}
.set-btn svg{width:1.9rem;height:1.9rem;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;margin-right:.7rem;flex:0 0 auto}
.set-btn svg circle{fill:#1a0703}
.set-car{display:block;width:.6rem;height:.6rem;border-right:.2rem solid var(--muted);border-bottom:.2rem solid var(--muted);-webkit-transform:rotate(45deg);transform:rotate(45deg);margin:-.35rem 0 0 .9rem;flex:0 0 auto}
.set-btn[aria-expanded="true"]{border-color:var(--gold);background:rgba(255,153,51,.14)}
.setp{position:absolute;top:8.6rem;right:3.4rem;z-index:40;min-width:36rem;padding:1.2rem 1.8rem;border-radius:1.6rem;background:rgba(30,9,3,.98);border:.08rem solid rgba(255,200,87,.35);
  box-shadow:0 2rem 5rem rgba(0,0,0,.6);-webkit-animation:setIn .22s cubic-bezier(.2,.7,.2,1) both;animation:setIn .22s cubic-bezier(.2,.7,.2,1) both}
@-webkit-keyframes setIn{from{opacity:0;-webkit-transform:translateY(-.6rem)}to{opacity:1;-webkit-transform:none}}
@keyframes setIn{from{opacity:0;transform:translateY(-.6rem)}to{opacity:1;transform:none}}
body.reduced .setp{-webkit-animation:none;animation:none}
.setp-r{display:flex;align-items:center;justify-content:space-between;padding:.9rem 0}
.setp-r + .setp-r{border-top:.08rem solid rgba(255,200,87,.12)}
.setp-k{font-size:1.35rem;color:var(--muted);font-weight:600;margin-right:2.4rem;white-space:nowrap}
body.mr #setRngR{display:none}
/* the rooms: "नज़र बदलें" already goes back to the start screen -- one button is enough */
#erBack{display:none!important}
/* C2 the status pill says how fresh the data is by colour: live pulses, fresh green, late amber, old red */
.chip.lvl-recent{border-color:rgba(123,211,137,.45)}
.chip.lvl-delayed,.chip.lvl-saved{border-color:rgba(255,179,0,.6);background:rgba(255,179,0,.12)} .chip.lvl-saved .cd{background:var(--amber)}
.chip.lvl-stale{border-color:rgba(255,107,91,.6);background:rgba(255,107,91,.14);color:#FFD9D3} .chip.lvl-stale .cd{background:var(--bad)}
/* C3 "next" in every mode; it lights up for the last seconds of a screen */
.st-count.nx{-webkit-transition:color .4s ease,-webkit-transform .4s ease;transition:color .4s ease,transform .4s ease}
.st-count.nx.soon{color:var(--text);-webkit-transform:translateX(-.4rem);transform:translateX(-.4rem)}
.st-count.nx.soon b{color:#FFE3A3}
/* C5 the progress rail: one segment per screen, the one on now fills; the count at its end */
#prog{display:flex;align-items:center;height:auto;background:none;border-radius:0;overflow:visible;margin-top:.6rem}
.pg-seg{flex:1 1 auto;display:flex;height:.45rem;min-width:0}
.pg-seg b{display:block;-webkit-box-flex:1;-webkit-flex:1 1 0;flex:1 1 0;height:100%;margin-right:.35rem;border-radius:.3rem;background:rgba(255,255,255,.12);overflow:hidden}
.pg-seg b:last-child{margin-right:0}
.pg-seg b.done{background:rgba(255,200,87,.5)}
.pg-seg b i{display:block;height:100%;width:0;background:linear-gradient(90deg,#E65100,#FFC857)}
.pg-n{flex:0 0 auto;margin-left:1.4rem;font-family:var(--head);font-weight:700;font-size:1.35rem;color:var(--muted);letter-spacing:.06rem;white-space:nowrap}
/* C6 the controls live in the footer row (space kept for them), never over the screen */
.foot{flex:0 0 auto;display:flex;align-items:center;margin-top:.7rem;min-height:3.4rem}
.foot .honesty{flex:1 1 auto;min-width:0;margin-top:0;margin-right:1.6rem}
.foot .ctl{position:static;left:auto;bottom:auto;-webkit-transform:none;transform:none;flex:0 0 auto;margin-left:auto;padding:.2rem .4rem;box-shadow:none;background:rgba(24,7,3,.9);-webkit-transition:opacity .25s ease;transition:opacity .25s ease}
.foot .ctl button{width:3rem;height:3rem}
.foot .ctl svg{width:1.7rem;height:1.7rem}
.foot .ctl .dots{display:none}
body.kiosk .foot{min-height:0} body.kiosk .foot .ctl{display:none}
/* C7 caveats as small amber tags, not a run-on line of small print */
.honesty .warn{display:inline-block;margin-right:.8rem;padding:.1rem 1rem .15rem;border-radius:2rem;line-height:1.55;color:#FFD27A;background:rgba(255,179,0,.1);border:.08rem solid rgba(255,179,0,.35)}
.honesty .warn:before{content:'';display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--amber);margin-right:.65rem;vertical-align:.2rem}
/* C8 ticker: soft edges, a diamond between items, the source quieter than the headline, a dot that pulses only for fresh news */
.tk-track{-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0,#000 2.6rem,#000 calc(100% - 5rem),rgba(0,0,0,0) 100%);mask-image:linear-gradient(90deg,rgba(0,0,0,0) 0,#000 2.6rem,#000 calc(100% - 5rem),rgba(0,0,0,0) 100%)}
.tk-item{border-right:0;padding:0 0 0 2.4rem}
.tk-item:after{content:'';display:block;flex:0 0 auto;width:.55rem;height:.55rem;margin-left:2.4rem;background:var(--saffron);opacity:.75;-webkit-transform:rotate(45deg);transform:rotate(45deg)}
.tk-src{color:var(--dim);font-weight:400}
.tk-dot{display:block;width:.8rem;height:.8rem;border-radius:50%;background:rgba(255,255,255,.6);margin-right:.9rem;flex:0 0 auto}
.tk-lbl.fresh .tk-dot{background:#fff;-webkit-animation:tkPulse 1.8s ease-out infinite;animation:tkPulse 1.8s ease-out infinite}
@-webkit-keyframes tkPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}70%{box-shadow:0 0 0 .7rem rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@keyframes tkPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}70%{box-shadow:0 0 0 .7rem rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
body.reduced .tk-lbl .tk-dot{-webkit-animation:none;animation:none}
/* phone: the rail stays a thin strip on the bottom edge, the controls float above it as before */
body.phone .pg-n{display:none} body.phone .pg-seg{height:100%} body.phone .pg-seg b{margin-right:.2rem;border-radius:0}
body.phone .foot{min-height:0}

body.phone .setp{position:relative;top:auto;right:auto;left:auto;min-width:0;margin:.6rem 0 0}

/* ---------- rebuilt screens (audit phase 4) ---------- */
/* breakout: the multiplier, then a meter from usual (grey) to now (green) */
.bo-main{flex-direction:column;align-items:stretch;justify-content:center}
.bo-hd{display:flex;align-items:center}

.bo-xw{flex:0 0 auto;margin-left:2rem;text-align:right}
.bo-x{font-size:8.4rem}
.bo-xl{font-size:1.4rem;max-width:22rem;margin:.4rem 0 0 auto;line-height:1.3}
.bo-mk{margin-top:3.2rem;font-size:1.4rem;color:var(--muted);letter-spacing:.06rem}
.bo-m{margin-top:.8rem}

.bo-tr .u{background:rgba(255,247,238,.32)}
.bo-tr .g{background:linear-gradient(90deg,#3E9E57,#7BD389);-webkit-transform-origin:left center;transform-origin:left center;-webkit-animation:boGrow 1.1s cubic-bezier(.2,.7,.2,1) .3s both;animation:boGrow 1.1s cubic-bezier(.2,.7,.2,1) .3s both}
@-webkit-keyframes boGrow{from{-webkit-transform:scaleX(0)}to{-webkit-transform:none}}
@keyframes boGrow{from{transform:scaleX(0)}to{transform:none}}

.bo-ml{display:flex;justify-content:space-between;margin-top:1rem}
.bo-ml > span{display:flex;flex-direction:column}
.bo-ml > .n{align-items:flex-end;text-align:right}

.bo-main .bo-detail{margin-top:2rem}
.bo-row .n .bo-m{margin-top:.7rem}
/* the most-viewed post: the post, and what it did */
.tpc{display:grid;grid-template-columns:1fr 34rem;grid-gap:2rem;height:100%}

.tpc-by{display:flex;align-items:center;flex:0 0 auto;position:relative}

.tpc-by b{display:block;font-family:var(--head);font-size:2.8rem;line-height:1.1}
.tpc-by span{font-size:1.4rem;color:var(--muted)}
.tpc-q{flex:0 1 auto;min-height:0;margin:auto 0;padding:2rem 0 1rem;font-size:3.2rem;line-height:1.42;font-weight:500;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden;position:relative}

.tpc-st > span{display:block;font-size:1.4rem;color:var(--muted);margin-top:.3rem}
.tpc-ctx{flex:0 0 auto;margin-top:1.2rem;padding:1.3rem 2rem}
.tpc-ctx b{display:block;font-family:var(--head);font-weight:700;font-size:3.4rem;line-height:1;color:var(--gold)}
.tpc-ctx span{display:block;font-size:1.4rem;color:var(--muted);margin-top:.5rem;line-height:1.35}

/* "in simple words": a front page -- the number in its own column, the sentence beside it */
.glass.fp{display:flex;flex-direction:column;padding-top:1rem;padding-bottom:1rem}
.fp-r{flex:1 1 0;display:flex;align-items:center;min-height:0;border-bottom:.08rem solid rgba(255,200,87,.13);-webkit-animation:rowIn .55s cubic-bezier(.2,.7,.2,1) both;animation:rowIn .55s cubic-bezier(.2,.7,.2,1) both}
.fp-r:last-child{border-bottom:0}
.fp-k{flex:0 0 22rem;text-align:right;padding-right:3rem;font-family:var(--head);font-weight:700;font-size:5rem;line-height:1;color:var(--gold);white-space:nowrap}

/* profile: zero stats quiet, and "this period vs usual" as paired bars */
.pf-k div.z b{color:var(--dim)}
.pfc{margin-top:1.4rem;padding:1.1rem 1.8rem;border-radius:1.4rem;background:rgba(0,0,0,.22);border:.08rem solid var(--line)}

/* ---------- the rooms (audit phase 5) ---------- */
/* M1 pictures: a band across the big card (fading into it), a faded backdrop behind the small ones */
.mr-im{flex:0 1 33%;min-height:7rem;position:relative;overflow:hidden;margin:1.4rem -2.6rem 0;background:#140502}
.mr-im img{display:block;width:100%;height:100%;object-fit:cover}
.mr-im:after{content:'';position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(180deg,rgba(24,7,2,0),rgba(24,7,2,.95))}
.mr-c.mr-lead.has-im .mr-t{margin:1.2rem 0 auto;font-size:2.8rem;line-height:1.32;-webkit-box-flex:0;-webkit-flex-shrink:0;flex-shrink:0;-webkit-line-clamp:3}   /* the picture gives way before the headline does */
.mr-bg{position:absolute;top:0;left:0;right:0;height:72%;overflow:hidden;pointer-events:none}
.mr-bg img{display:block;width:100%;height:100%;object-fit:cover;opacity:.42}
.mr-bg:after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(24,7,2,.55) 0%,rgba(24,7,2,.3) 35%,rgba(24,7,2,.96) 100%)}
.mr-c > .mr-h,.mr-c > .mr-t,.mr-c > .mr-f{position:relative;z-index:1}
.mr-c.has-im .mr-t{text-shadow:0 .1rem .6rem rgba(0,0,0,.7)}
/* M2 a small card may use four lines (fitClamps trims to the room there really is) */
.mr-t{-webkit-line-clamp:4}
/* M3 "just in" is a ribbon on the card's top edge */
.mr-new{position:absolute;top:0;right:1.6rem;z-index:2;display:flex;align-items:center;height:2rem;padding:0 .9rem;border-radius:0 0 .7rem .7rem;background:var(--live);color:#fff;font-size:1.2rem;font-weight:700;letter-spacing:.03rem;box-shadow:0 .4rem 1.2rem rgba(255,61,0,.4)}
.mr-new .mr-dot{background:#fff;width:.6rem;height:.6rem;margin-right:.45rem}
.mr-c.mr-lead.is-new{padding-top:3rem}
.mr-c.is-new:not(.mr-lead) .mr-when{visibility:hidden}   /* on a small card the ribbon says it: no extra line for it */
body.portrait .mr-im,body.phone .mr-im{flex:none;height:18rem}
body.phone .mr-im{height:15rem;margin-left:-1.6rem;margin-right:-1.6rem} body.phone .mr-bg img{opacity:.24} body.phone .mr-c.mr-lead.has-im .mr-t{font-size:2.1rem}

/* M6 the "what to show" panel: the screen behind dims, the panel slides in from the right */
body.mrp-on #app:after{content:'';position:fixed;top:0;left:0;right:0;bottom:0;z-index:25;background:rgba(10,3,1,.62);pointer-events:none;-webkit-animation:dimIn .24s ease both;animation:dimIn .24s ease both}
@-webkit-keyframes dimIn{from{opacity:0}to{opacity:1}} @keyframes dimIn{from{opacity:0}to{opacity:1}}
.mrp:not(.hidden){-webkit-animation:mrpIn .26s cubic-bezier(.2,.7,.2,1) both;animation:mrpIn .26s cubic-bezier(.2,.7,.2,1) both}
@-webkit-keyframes mrpIn{from{opacity:0;-webkit-transform:translateX(2.4rem)}to{opacity:1;-webkit-transform:none}} @keyframes mrpIn{from{opacity:0;transform:translateX(2.4rem)}to{opacity:1;transform:none}}
body.reduced .mrp:not(.hidden),body.reduced.mrp-on #app:after{-webkit-animation:none;animation:none}

/* E1 past results: a mark before each party, the majority line across every bar, the winners ticked */
.er-pc .mb em{display:flex;align-items:center;flex-basis:10rem}
.er-pc .mb em i{flex:0 0 auto;width:1rem;height:1rem;border-radius:.25rem;margin-right:.6rem}
.er-pc .mb span{position:relative}
.er-pc .mb .mj{position:absolute;top:-.2rem;bottom:-.2rem;width:0;border-left:.18rem dashed rgba(255,247,238,.55)}
.er-pc .mb.w em,.er-pc .mb.w b{color:var(--gold)}
.er-pc .mb.w em:after{content:'';display:inline-block;width:.45rem;height:.85rem;margin-left:.6rem;border:solid var(--good);border-width:0 .2rem .2rem 0;-webkit-transform:rotate(45deg);transform:rotate(45deg)}
/* E2 bye-polls: the winning party as a coloured chip */
.er-ln small.pc{color:#fff;padding:.1rem .7rem;border-radius:.5rem;font-size:1.25rem;text-shadow:0 .08rem .2rem rgba(0,0,0,.35)}
/* E3 the head-to-head stands on a card (it floated on the photo before) */
.er-ds{background:var(--glass);border:.08rem solid var(--line);border-radius:1.8rem;box-shadow:0 2rem 4rem rgba(0,0,0,.35)}
body.phone .er-c .hd{flex-wrap:wrap} body.phone .er-c .hd b{white-space:normal}

/* E7 a footer note that informs (nothing being counted, news only) is neutral, not a warning */
.honesty .inf{display:inline-block;margin-right:.8rem;padding:.1rem 1rem .15rem;border-radius:2rem;line-height:1.55;color:var(--muted);background:rgba(255,255,255,.06);border:.08rem solid rgba(255,255,255,.14)}
.honesty .inf:before{content:'';display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--grey);margin-right:.65rem;vertical-align:.2rem}

/* ---------- shared helpers (audit G5 / G6) ---------- */
/* cut text to whole lines with "…" (fitClamps lowers the count when a card is squeezed) */
.clamp-1,.clamp-2,.clamp-3{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden} .clamp-1{-webkit-line-clamp:1} .clamp-2{-webkit-line-clamp:2} .clamp-3{-webkit-line-clamp:3}
/* where the remote is: a gold ring with a soft glow, shown while keys are in use (body.kbd: a TV
   remote or a keyboard; a mouse click or a touch hides it again). Chromium 68 has no :focus-visible. */
body.kbd button:focus,body.kbd a:focus,body.kbd input:focus,body.kbd [tabindex]:not([tabindex="-1"]):focus{outline:none;
  box-shadow:0 0 0 .3rem var(--gold),0 0 2.4rem rgba(255,200,87,.55)!important;border-color:var(--gold)!important}
body.kbd .mrp button.o.on:focus,body.kbd .mrp-x:focus,body.kbd .spd button.on:focus{box-shadow:0 0 0 .3rem #fff,0 0 2.4rem rgba(255,255,255,.45)!important}
</style>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------ settings */
  var Q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
    if (!kv) return; var i = kv.indexOf('='), k = i < 0 ? kv : kv.slice(0, i);
    try { Q[decodeURIComponent(k)] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); } catch (e) {}
  });
  /* Opening Nazar (a new tab, a bookmark, a refresh) always starts on All India -- never on
     whatever was open last. The address carries a view only for this tab itself: choosing a
     state reloads the page with ?scope=, and the 6-hourly refresh reloads the view it was on;
     both mark the tab first (nazar_keep, this tab only). A TV link (kiosk=1) and the UP entry
     (/up -> ?scope=up) keep theirs always. Choices made inside the rooms (a state, a city, the
     practice replay) last for this tab only, too. */
  function sstore(k, v) { try { if (v === undefined) return window.sessionStorage.getItem(k); if (v === null) window.sessionStorage.removeItem(k); else window.sessionStorage.setItem(k, v); } catch (e) { return null; } return null; }
  var VIEW_KEYS = /^(scope|mode|h|est|etype|ecity|edemo|area|t|mrstate)$/;
  /* these used to be kept on the device for good: dropped, so an old choice never comes back */
  try { ['nazar_er_state', 'nazar_er_city', 'nazar_er_demo', 'nazar_er_type', 'nazar_mr_state'].forEach(function (k) { window.localStorage.removeItem(k); }); } catch (e) {}
  (function () {
    /* link=1: a shared link to one view (/live/media, /live/n/<handle>, /live/s/<State>) opens that view */
    var keep = Q.kiosk === '1' || Q.link === '1' || sstore('nazar_keep') === '1';
    sstore('nazar_keep', null);
    if (keep) return;
    Object.keys(Q).forEach(function (k) { if (VIEW_KEYS.test(k) && !(k === 'scope' && Q[k] === 'up')) delete Q[k]; });
    var rest = location.search.replace(/^\?/, '').split('&').filter(function (kv) { var k = kv.split('=')[0]; return kv && (!VIEW_KEYS.test(k) || kv === 'scope=up'); });
    try { history.replaceState(null, '', location.pathname + (rest.length ? '?' + rest.join('&') : '') + location.hash); } catch (e) {}
  })();
  /* scope: 'all', 'up', or one state ('st:Bihar') -- a state scope makes every
     screen, the leader search and the news about that state only */
  var SCOPE = Q.scope === 'up' ? 'up' : (/^st:./.test(Q.scope || '') ? Q.scope : 'all');
  var STATE = SCOPE === 'up' ? 'Uttar Pradesh' : (SCOPE.indexOf('st:') === 0 ? SCOPE.slice(3) : null);
  var KIOSK = Q.kiosk === '1';
  var DEMO = Q.demo === '1';
  var ASOF = Q.asof || '';
  /* window length: the latest 24 / 48 / 72 hours (?hrs=48, else the last choice on this device) */
  var HOURS_OK = [24, 48, 72];
  var HOURS = HOURS_OK.indexOf(+Q.hrs) >= 0 ? +Q.hrs : (HOURS_OK.indexOf(+store('nazar_hours')) >= 0 ? +store('nazar_hours') : 24);
  /* standalone prototype: the server reads a recorded CSV export, not a live feed */
  var PROTO = window.NAZAR_PROTO || null;
  var REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var REFRESH_MS = 60000, BACKOFF = [60000, 120000, 300000], FIRST_RETRY = [5000, 10000, 20000, 30000, 60000], API_TIMEOUT_MS = 20000, SOFT_RELOAD_MS = 6 * 3600000, CHOOSER_AUTO_S = 20;
  /* leader photos -- replace the files (same names) to change them; see live_assets/leaders/ATTRIBUTION.md */

  document.addEventListener('keydown', function (e) {
    if (!introDone) { endIntro(); return; }
    if (!state.mode) return;
    if (MR.open) { mrKey(e); return; }
    if (setOpen()) { setKey(e); return; }
    var k = e.key || '';
    if ((k === 'm' || k === 'M') && state.mode === 'media') pause(true);
    else if ((k === 'm' || k === 'M') && state.mode === 'election') erOpenPanel();
    /* the remote's Back in the Election Room: back to the start screen */
    else if ((k === 'Escape' || k === 'Esc' || k === 'Backspace' || k === 'GoBack' || k === 'BrowserBack') && (state.mode === 'election' || state.mode === 'media')) { openChooser(); e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'Right' || k === 'MediaTrackNext') show(state.idx + 1);
    else if (k === 'ArrowLeft' || k === 'Left' || k === 'MediaTrackPrevious') show(state.idx - 1);
    else if (k === ' ' || k === 'Spacebar' || k === 'MediaPlayPause' || k === 'Enter') { if (k === 'Enter' && e.target && e.target.tagName === 'BUTTON') return; pause(!state.paused); e.preventDefault(); }
    else if (k === 'f' || k === 'F') fullscreen();
    else if (k === 'l' || k === 'L') toggleLang();
    else return;
    wake();
  });
  $('intro').addEventListener('click', endIntro);

  /* ---------------------------------------- run-for-days housekeeping */
  var wakeLock = null;
  function keepAwake() {
    try { if (navigator.wakeLock && document.visibilityState === 'visible' && !wakeLock) navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; l.addEventListener('release', function () { wakeLock = null; }); }).catch(function () {}); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { keepAwake(); if (state.mode && !state.stopped && Date.now() - state.lastOk > REFRESH_MS) { clearTimeout(fetchTimer); fetchData(); } }
  });
  function softReload() {
    if (state.stopped) return;
    if (!DEMO && Date.now() - state.lastOk > 3 * 60000) { setTimeout(softReload, 10 * 60000); return; }
    if (!state.mode) { setTimeout(softReload, 10 * 60000); return; }      // never reload in the middle of a choice
    if (KIOSK) { location.reload(); return; }
    /* the same view again (a plain reload would start on All India) */
    sstore('nazar_keep', '1'); try { window.sessionStorage.setItem('nazar_skip_intro', '1'); } catch (e) {}
    var rest = location.search.replace(/^\?/, '').split('&').filter(function (kv) { return kv && !VIEW_KEYS.test(kv.split('=')[0]); });
    if (SCOPE !== 'all') rest.push('scope=' + encodeURIComponent(SCOPE));
    rest.push(state.mode === 'person' ? 'h=' + encodeURIComponent(state.person) : 'mode=' + state.mode);
    location.href = location.pathname + '?' + rest.join('&');
  }

  /* ---------------------------------------------------------- demo */
  function demoSnap() {
    var P = [['BJP', '#E65100', 6100, 1.31e7, 1150, 1800], ['INC', '#1565C0', 820, 3.9e6, 230, 430], ['AAP', '#00838F', 240, 1.7e6, 80, 110], ['SP', '#E41E24', 170, 1.5e6, 50, 120], ['TDP', '#FF8F00', 230, 2.1e5, 80, 125]];
    var parties = P.map(function (x) {
      return { party: x[0], color: x[1], posts: x[2], views: x[3], postShare: Math.round(1000 * x[2] / 7560) / 10, viewShare: Math.round(1000 * x[3] / 2.05e7) / 10,
               accounts: { mapped: null, collected: x[5], active: x[4] }, postsPerCollected: Math.round(100 * x[2] / x[5]) / 100, viewsPerCollected: Math.round(x[3] / x[5]), limited: false, logo: null };
    });
    parties.push({ party: 'Others', color: '#546E7A', posts: 900, views: 3.6e6, postShare: null, viewShare: null, accounts: {}, postsPerCollected: null, viewsPerCollected: null, parts: 24 });
    var lead = {}; P.forEach(function (x) { lead[x[0]] = [1, 2, 3].map(function (n) { return { handle: 'sample' + n, name: 'Sample Leader ' + x[0] + ' ' + n, state: 'Uttar Pradesh', posts: 5 - n, views: 900000 / n, avatar: null }; }); });
    return { scope: SCOPE, mode: 'demo', generatedAt: new Date().toISOString(),
      status: { level: 'recent', label: 'latest', newestPostAt: '2026-10-18 23:59:00 IST', newestAgeMin: null, lastPushAt: null, pipeline: null },
      window: { mode: 'lastFullDay', from: '2026-10-18 00:00:00 IST', to: '2026-10-18 23:59:59 IST', day: '2026-10-18' },
      coverage: { estimated: true, ratio: 0.8 }, kpis: { originalPosts: 8460, views: 2.4e7, accounts: 1900, statesCovered: 26 },
      excluded: { media: 4300, retweets: 6200, noParty: 80, noState: 380 }, parties: parties, leadersByParty: lead,
      states: [['Uttar Pradesh', 1700, 'BJP', '#E65100'], ['Maharashtra', 900, 'BJP', '#E65100'], ['Gujarat', 630, 'BJP', '#E65100'], ['Punjab', 300, 'AAP', '#00838F'], ['Karnataka', 280, 'INC', '#1565C0'], ['Delhi', 240, 'AAP', '#00838F']]
        .map(function (x) { return { state: x[0], posts: x[1], leadParty: x[2], color: x[3], limited: false }; }),
      topPost: { name: 'Sample Leader BJP 1', party: 'BJP', state: 'Uttar Pradesh', views: 980000, date: '2026-10-18 09:12:00 IST', text: 'This is sample text for the demo view. It shows how the most-viewed post of the period will appear on screen.' },
      breakout: [{ name: 'Sample Leader SP 1', party: 'SP', state: 'Uttar Pradesh', ratio: 4.5, recentMedian: 460000, baseMedian: 103000, basePosts: 104 }],
      compare: { comparable: true, prevPosts: 9000 },
      ticker: [{ head: 'Sample headline one for the demo ticker', src: 'Sample Channel', date: '2026-10-18 21:00:00 IST', topic: 'Politics' }, { head: 'Sample headline two, another media update', src: 'Sample News', date: '2026-10-18 20:10:00 IST', topic: 'Governance' }],
      facts: [{ type: 'window_posts', posts: 8460, accounts: 1900 }, { type: 'top_state', state: 'Uttar Pradesh', posts: 1700 }],
      coverageStats: { handlesMapped: 5200, postsInDatabase: 2778000 } };
  }

  /* ----------------------------------------------------------- start */
  if (KIOSK) document.body.className += ' kiosk kbd';
  /* keys in use (remote / keyboard) -> the focus ring shows; a mouse or a touch -> it hides */
  document.addEventListener('keydown', function (e) { if (e.key !== 'Shift' && e.key !== 'Control' && e.key !== 'Alt' && e.key !== 'Meta') setCls(document.body, 'kbd', true); }, true);
  ['mousedown', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, function () { if (!KIOSK) setCls(document.body, 'kbd', false); }, true); });
  if (PROTO) document.body.className += ' proto';
  if (REDUCED) document.body.className += ' reduced';
  setupHero(); scale();
  window.addEventListener('resize', function () { clearTimeout(scale.t); scale.t = setTimeout(scale, 150); });
  /* some TVs never fire "resize": look every 2 s (scale() does nothing when the size is the same) */
  setInterval(function () { scale(); }, 2000);
  window.addEventListener('orientationchange', function () { setTimeout(function () { scale(true); }, 300); });
  applyLang(); renderClock(); setInterval(renderClock, 10000); keepAwake();
  heroLevel('hi'); $('app').style.visibility = 'hidden';
  /* the intro shows real numbers, so fetch the All-India snapshot while it plays */
  if (!DEMO) api('/api/live-snapshot' + q()).then(function (j) { if (j && !j.__notfound) { state.all = j; introStats(); } }).catch(function () {});
  else state.all = demoSnap();
  /* the Media Room's news too, a moment later, so it opens at once when chosen (api() keeps it 25 s;
     after that the browser cache is gone but the server answers from its ready copy) */
  if (!DEMO) setTimeout(function () { api(mrUrl()).catch(function () {}); }, 1200);
  playIntro(function () {
    if (Q.h) startShow('person', Q.h);
    else if (Q.mode === 'media') startShow('media');
    else if (Q.mode === 'election') startShow('election');
    else startShow('all');                       // the start screen opens from "नज़र बदलें"
  });
  if (!DEMO) setTimeout(softReload, SOFT_RELOAD_MS);
})();
</script>
