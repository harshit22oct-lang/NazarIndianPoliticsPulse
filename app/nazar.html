<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<title>Nazar · India Political Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<!--
  NAZAR (नज़र) -- the TV page of India Political Pulse.
  Two shows: All India (the whole picture) and One leader (a personal channel).
  Data: /api/live-snapshot, /api/live-person, /api/live-search (definitions in live_lib.js).
  Written for old smart-TV browsers (Chromium 68+): ES5, CSS variables + calc,
  no clamp(), inset, flex gap, aspect-ratio, color-mix, conic gradients or optional chaining.
  The layout is in rem; the root font size follows the screen, so 4K, 1080p, laptops
  and phones all get the same composition. Nothing must depend on an animation finishing.
  Leader photos: live_assets/leaders (see ATTRIBUTION.md there).
-->
<style>
:root{
  --text:#FFF7EE; --muted:rgba(255,247,238,.80); --dim:rgba(255,247,238,.56);
  --saffron:#FF9933; --saffron2:#E65100; --deep:#9E3600; --gold:#FFC857; --green:#2E9E4A;
  --glass:rgba(24,7,3,.94); --glass2:rgba(40,12,4,.70); --line:rgba(255,153,51,.24);
  --live:#FF3D00; --amber:#FFB300; --grey:#B0A49A; --good:#7BD389; --bad:#FF6B5B;
  /* roles: brand saffron is for the frame and the main action; party colours only where a party is meant;
     --good / --bad / --amber only for status (up / down / stale) */
  --cta:linear-gradient(135deg,#E65100,#FF9933); --cta-glow:rgba(230,81,0,.45); --edge:#FFC857;
  --head:'Rajdhani','Noto Sans Devanagari',sans-serif;
  --body:'DM Sans','Noto Sans Devanagari',sans-serif;
  --deva:'Noto Sans Devanagari','DM Sans',sans-serif;
  --heroMain:.1; --heroSide:.08;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;height:100%;background:#160602;-webkit-text-size-adjust:100%;text-size-adjust:100%}   /* no Android / iOS text inflation */
/* a laptop browser window (wide and short, set by scale()): slimmer frame, more height for the screens */
body.wide #app{padding:1rem 3.4rem 1rem} body.wide .top{height:6.4rem} body.wide #stage{padding-top:.8rem}
body.wide .st-head{margin-bottom:1rem} body.wide .st-title{font-size:4.6rem} body.wide .ticker{height:3.9rem;margin-top:.7rem} body.wide .tk-single{line-height:3.9rem}
body.wide #chooser{padding:1.2rem 3.4rem 1.2rem;overflow-y:auto} body.wide .ch-q{margin-top:0} body.wide .ch-q h1{font-size:3.2rem} body.wide .ch-q p{font-size:1.4rem;margin-top:.3rem}
body.wide .ch-cards{margin-top:1.2rem}
body{height:100%;overflow:hidden;background:#160602;color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
body.idle,body.kiosk{cursor:none}
button,input{font-family:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- backdrop: saffron dawn + the three leaders ---------- */
#sky{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 75% 60% at 50% -5%,rgba(255,153,51,.55) 0%,rgba(255,120,0,.18) 38%,rgba(255,120,0,0) 64%),
             radial-gradient(ellipse 45% 40% at -5% 105%,rgba(46,158,74,.26) 0%,rgba(46,158,74,0) 65%),
             radial-gradient(ellipse 45% 40% at 105% 105%,rgba(255,153,51,.22) 0%,rgba(255,153,51,0) 65%),
             linear-gradient(180deg,#4a1504 0%,#2a0a03 42%,#150502 100%)}
#sky:after{content:'';position:absolute;top:0;left:0;right:0;height:.35rem;
  background:linear-gradient(90deg,#FF9933 0%,#FF9933 33%,#FFFFFF 33%,#FFFFFF 66%,#138808 66%,#138808 100%);opacity:.85}
#hero{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;overflow:hidden}
/* two standing leaders: Modi ji in front (tallest, head just under the header),
   Nitin Nabin ji a step behind on his right. A soft saffron floor glow grounds them. */
.hero-floor{position:absolute;left:8%;right:8%;bottom:-6%;height:30%;opacity:var(--heroMain);transition:opacity 1.2s ease;
  background:radial-gradient(ellipse 50% 45% at 50% 70%,rgba(255,153,51,.38) 0%,rgba(255,120,0,.12) 45%,rgba(255,120,0,0) 72%)}
/* Each leader = a wrapper (position, size, glow) around the photo (bottom fade).
   The glow sits on the wrapper so it follows the faded silhouette -- on the photo
   itself the fade mask would clip the glow into a visible rectangle. */
.hero-main,.hero-side{position:absolute;-webkit-transform:translateX(-50%);transform:translateX(-50%)}
.hero-main img,.hero-side img{display:block;height:100%;width:auto}
.hero-main{bottom:0;left:50%;height:94%;z-index:5;opacity:var(--heroMain);
  -webkit-filter:drop-shadow(0 0 2.6rem rgba(255,153,51,.45));filter:drop-shadow(0 0 2.6rem rgba(255,153,51,.45))}
.hero-main img{-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,0) 0%,#000 20%);mask-image:linear-gradient(to top,rgba(0,0,0,0) 0%,#000 20%)}
/* positions are the centre of each figure. No brightness dimming and full opacity on the start / glance screens: a see-through
   or darkened photo over the maroon sky turns faces and clothes brown */
.hero-side{bottom:2%;z-index:4;opacity:var(--heroSide);
  -webkit-filter:drop-shadow(0 0 2rem rgba(255,153,51,.3));filter:drop-shadow(0 0 2rem rgba(255,153,51,.3))}
.hero-side img{-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,0) 0%,#000 14%);mask-image:linear-gradient(to top,rgba(0,0,0,0) 0%,#000 14%)}
/* two leaders: Modi ji in the centre, in front; Nitin Nabin ji right, a step behind.
   --sh is the side scale: Nabin ji's photo ends at the waist, so his height is
   --sh x 0.69, raised by 2 % + --sh x 0.289 so his eyes sit just below Modi ji's.
   His photo fades out longer at the bottom. */
#hero{--sh:86%}
.hero-side.r{height:calc(var(--sh) * .69);bottom:calc(2% + var(--sh) * .289);left:75.5%}
.hero-side.r img{-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,0) 0%,#000 26%);mask-image:linear-gradient(to top,rgba(0,0,0,0) 0%,#000 26%)}
/* start screen: the question is centred at the top, so everyone stands a little
   lower and Modi ji's face stays clear of the text */
body.choosing .hero-main{height:76%}
body.choosing #hero{--sh:69%}
.hero-main,.hero-side{transition:opacity 1.2s ease,height .8s ease,bottom .8s ease,left .8s ease}
/* screens narrower than 3:2 (4:3 TVs, tablets): the pair comes in and stands a little smaller */
@media (max-aspect-ratio:3/2){#hero{--sh:80%} .hero-side.r{left:80.5%} body.choosing #hero{--sh:64%}}
/* very wide screens (21:9): Nabin ji stands a little closer in */
@media (min-aspect-ratio:2/1){.hero-side.r{left:71.5%}}
body.hero-hi{--heroMain:1;--heroSide:1}
body.hero-mid{--heroMain:.55;--heroSide:.45}
/* data screens: the leaders step back (quiet = the default .1 above); "off" for screens with
   no card behind them, and on a leader's own channel (another leader's photo there reads as a mistake) */
body.hero-off,body.pmode.pmode{--heroMain:0;--heroSide:0}

/* ---------- frame ---------- */
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:1.6rem 3.4rem 1.4rem}
/* the brand (logo + नज़र) is sized to hold the top-left corner, so the left side
   doesn't look empty next to the leaders */
.top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;height:7rem}
.brand{display:flex;align-items:center}
.logo{width:6.2rem;height:6.2rem;border-radius:50%;overflow:hidden;margin-right:1.5rem;flex:0 0 auto;position:relative;
  background:linear-gradient(135deg,#FF9933,#E65100);box-shadow:0 0 0 .2rem rgba(255,200,87,.7),0 .6rem 1.8rem rgba(230,81,0,.5)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.logo svg{position:absolute;top:18%;left:18%;width:64%;height:64%}
.wm{font-family:var(--deva);font-weight:800;font-size:4.1rem;line-height:1;letter-spacing:.02rem;color:#fff;text-shadow:0 .2rem 1rem rgba(230,81,0,.6)}
.wm small{font-family:var(--head);font-weight:700;font-size:1.9rem;letter-spacing:.4rem;color:var(--gold);margin-left:1.1rem;vertical-align:.5rem}
.wm-sub{font-size:1.3rem;color:var(--muted);letter-spacing:.16rem;text-transform:uppercase;margin-top:.55rem}
.right{display:flex;align-items:center}
.right > *{margin-left:1.2rem}
.chip{display:flex;align-items:center;height:3rem;padding:0 1.3rem;border-radius:3rem;background:var(--glass);border:.08rem solid var(--line);font-size:1.3rem;font-weight:700;white-space:nowrap}
.chip .cd{width:.85rem;height:.85rem;border-radius:50%;margin-right:.75rem;background:var(--grey);flex:0 0 auto}
.chip.lvl-live{border-color:rgba(255,61,0,.7);background:rgba(255,61,0,.22)}
.chip.lvl-live .cd{background:var(--live);animation:pulse 1.6s ease-out infinite}
.chip.lvl-recent .cd{background:var(--good)} .chip.lvl-delayed .cd{background:var(--amber)}
.chip.lvl-stale .cd,.chip.lvl-nodata .cd{background:var(--grey)}
.chip.lvl-offline{border-color:rgba(255,107,91,.6)} .chip.lvl-offline .cd{background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,61,0,.7)}70%{box-shadow:0 0 0 .8rem rgba(255,61,0,0)}100%{box-shadow:0 0 0 0 rgba(255,61,0,0)}}
.clock{text-align:right;line-height:1.05}
.clock b{display:block;font-family:var(--head);font-weight:700;font-size:2.2rem;color:var(--gold)}
.clock span{font-size:1.2rem;color:var(--muted)}
.tbtn{height:3rem;padding:0 1.2rem;border-radius:.8rem;border:.08rem solid var(--line);background:var(--glass);font-size:1.3rem;font-weight:700;cursor:pointer;white-space:nowrap}
.tbtn:hover,.tbtn:focus{border-color:var(--gold);outline:none}
body.kiosk .tbtn{display:none}
/* screen speed: Slow / Normal / Fast (Normal = the timings the screens were designed for) */
/* a pill: speed icon, then three equal parts; the chosen one is a raised saffron chip */
.spd{display:flex;align-items:center;height:3rem;padding:0 .25rem 0 .2rem;border-radius:3rem;border:.08rem solid var(--line);background:var(--glass);flex:0 0 auto}
.spd .spd-i{display:block;width:2.2rem;height:2.2rem;margin:0 .2rem 0 .5rem;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;flex:0 0 auto}
.spd button{height:2.4rem;min-width:5rem;border:0;border-radius:2rem;background:transparent;padding:0 .9rem;font-family:var(--deva);font-size:1.3rem;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.spd button:hover,.spd button:focus{color:var(--text);background:rgba(255,153,51,.15);outline:none}
.spd button.on{background:linear-gradient(135deg,#E65100,#FF9933);color:#fff;box-shadow:0 .2rem .8rem rgba(230,81,0,.45)}
body.kiosk .spd{display:none}
body.mr #rng{display:none}          /* the Media Room has its own news, not the post window */

#stage{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;padding-top:1.4rem}
.st-head{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1.4rem}
.st-title{font-family:var(--head);font-weight:700;font-size:4.8rem;line-height:1.02;text-shadow:0 .3rem 1.4rem rgba(0,0,0,.55)}
.st-title em{font-style:normal;color:var(--gold)}
.st-title .tl{display:inline-block;width:3.6rem;height:3.6rem;border-radius:50%;overflow:hidden;vertical-align:-.5rem;margin-left:1rem;box-shadow:0 0 0 .15rem rgba(255,200,87,.6)}
.st-title .tl img{width:100%;height:100%;object-fit:cover;display:block}
.st-when{font-size:1.5rem;color:var(--muted);margin-top:.5rem;text-shadow:0 .1rem .5rem rgba(0,0,0,.6)}
.st-count{font-family:var(--head);font-size:1.4rem;color:var(--dim);white-space:nowrap;margin-left:2rem}
#scene{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;opacity:1;transition:opacity .45s ease,transform .45s ease}
#scene.out{opacity:0;-webkit-transform:translateY(.8rem);transform:translateY(.8rem)}
body.reduced #scene{transition:none}
.glass{background:var(--glass);border:.08rem solid var(--line);border-radius:1.8rem;padding:2.2rem 2.6rem;box-shadow:0 2rem 4rem rgba(0,0,0,.35),inset 0 .08rem 0 rgba(255,200,87,.15)}
.glass.full{height:100%}
.honesty{flex:0 0 auto;font-size:1.3rem;color:var(--dim);margin-top:1rem;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 .1rem .4rem rgba(0,0,0,.8)}
.honesty b{color:var(--muted);font-weight:700} .honesty .warn{color:var(--amber)}
#prog{flex:0 0 auto;height:.3rem;border-radius:.3rem;background:rgba(255,255,255,.1);margin-top:.8rem;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#E65100,#FFC857)}

/* ticker */
.ticker{flex:0 0 auto;height:4.4rem;margin-top:.9rem;border-radius:1rem;display:flex;align-items:center;overflow:hidden;background:rgba(26,8,3,.9);border:.08rem solid rgba(255,153,51,.4)}
.tk-lbl{flex:0 0 auto;height:100%;display:flex;align-items:center;padding:0 1.5rem;font-family:var(--head);font-weight:700;font-size:1.45rem;letter-spacing:.12rem;text-transform:uppercase;background:linear-gradient(135deg,#E65100,#FF9933);color:#fff;white-space:nowrap}
.tk-track{flex:1 1 auto;height:100%;overflow:hidden;position:relative}
.tk-inner{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.tk-inner.run{animation:tk linear infinite}
@keyframes tk{from{-webkit-transform:translateX(0);transform:translateX(0)}to{-webkit-transform:translateX(-50%);transform:translateX(-50%)}}
.tk-item{display:flex;align-items:center;padding:0 2.2rem;font-size:1.45rem;border-right:.08rem solid var(--line);height:2.4rem}
.tk-tag{font-size:1.2rem;font-weight:700;letter-spacing:.08rem;text-transform:uppercase;padding:.2rem .6rem;border-radius:.4rem;margin-right:.9rem;background:rgba(255,200,87,.15);color:var(--gold)}
.tk-tag.brk{background:var(--live);color:#fff}
.tk-src{color:var(--muted);margin-left:.9rem;font-size:1.3rem}
.tk-single{padding:0 2rem;font-size:1.45rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:4.4rem}

/* controls / banners / overlay */
.ctl{position:fixed;left:50%;bottom:7.6rem;-webkit-transform:translateX(-50%);transform:translateX(-50%);z-index:20;display:flex;align-items:center;padding:.6rem;border-radius:3rem;background:rgba(26,8,3,.95);border:.08rem solid var(--line);box-shadow:0 1rem 3rem rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.ctl.on{opacity:1;pointer-events:auto}
.ctl button{width:4rem;height:4rem;border-radius:50%;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 .2rem}
.ctl button:hover,.ctl button:focus{background:rgba(255,255,255,.1);outline:none}
.ctl svg{width:1.9rem;height:1.9rem}
.ctl .sep{width:.08rem;height:2.4rem;background:var(--line);margin:0 .5rem}
.ctl .dots{display:flex;align-items:center;padding:0 .8rem}
.ctl .dots i{width:.7rem;height:.7rem;border-radius:50%;background:rgba(255,255,255,.25);margin:0 .22rem}
.ctl .dots i.on{background:var(--gold);width:1.8rem;border-radius:.4rem}
.banner{position:fixed;top:.35rem;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);z-index:60;padding:.5rem 1.6rem;border-radius:0 0 .8rem .8rem;font-weight:700;font-size:1.3rem;letter-spacing:.06rem;text-transform:uppercase}
.banner.demo{background:#FFC857;color:#111} .banner.hist{background:#7E57C2;color:#fff}
.banner.proto{background:rgba(26,8,3,.92);color:var(--gold);border:.08rem solid rgba(255,200,87,.45);border-top:0;text-transform:none;letter-spacing:.02rem}
/* the prototype has no dashboard to go back to */
body.proto #backBtn,body.proto #chBack{display:none}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:70;background:rgba(22,6,2,.9);display:flex;align-items:center;justify-content:center}
.ov-box{max-width:52rem;padding:3.2rem 3.6rem;border-radius:1.6rem;background:#2a0a03;border:.08rem solid var(--line);text-align:center}
.ov-box h2{font-family:var(--head);font-size:3.2rem;margin-bottom:1rem}
.ov-box p{font-size:1.5rem;color:var(--muted);line-height:1.5;margin-bottom:2rem}
.btn{display:inline-block;padding:1rem 2.4rem;border-radius:3rem;background:linear-gradient(135deg,#E65100,#FF9933);color:#fff;font-weight:700;font-size:1.4rem;text-decoration:none;border:0;cursor:pointer}

/* ---------- intro ---------- */
#intro{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 60% 55% at 50% 45%,#5a1a05 0%,#2a0a03 55%,#140502 100%);transition:opacity .8s ease}
#intro.gone{opacity:0;pointer-events:none}
/* "Kamal Udaya" -- the lotus rises over India (about 9 s, any key / click skips):
   0.0 a spark at the heart of the map -> 0.3 light spreads state by state outward
   -> 1.7 ripples on water -> 2.0 a bud rises on its stem -> 2.6 the petals open
   (outer first, like a real lotus) -> 3.7 pollen burst + rays -> 4.5 the official
   BJP disc grows behind the lotus while the lotus settles to exactly the size and
   place of the lotus in the logo, then hands over to it -> 5.2 wordmark -> 6.1 numbers.
   Everything inside .in-stage is in % of the (square) stage, so portrait just
   shrinks the stage. Only transform/opacity/stroke are animated (cheap on TVs). */
.in-stage{position:relative;width:36rem;height:36rem}
.in-stage > *{position:absolute}
.in-rays{top:-14%;left:-14%;width:128%;height:128%;opacity:0;animation:inFade 1.4s 3.6s ease forwards}
.in-rays g{-webkit-transform-origin:100px 100px;transform-origin:100px 100px;animation:inSpin 70s linear infinite}
.in-map{top:0;left:0;width:100%;height:100%;animation:inMapDim 1.2s 4.6s ease forwards}
.in-map path{fill:url(#inTri);fill-opacity:0;stroke:#FFB04D;stroke-width:.05;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:inDraw 1.1s ease forwards,inFill 1.4s 2.3s ease forwards}
@keyframes inDraw{0%{stroke-dashoffset:1;stroke:#FFF3C4}60%{stroke:#FFE08A}100%{stroke-dashoffset:0;stroke:#FF9933}}
@keyframes inFill{to{fill-opacity:.2}}
/* a state show: that state glows gold on the map */
.in-map path.sel{fill:#FFC857;stroke:#FFF3C4;stroke-width:.12;animation:inDraw 1.1s ease forwards,inFillSel 1.6s 2.1s ease forwards}
@keyframes inFillSel{to{fill-opacity:.62}}
body.reduced .in-map path.sel{fill-opacity:.62}
@keyframes inMapDim{to{opacity:.55}}
.in-spark{top:50%;left:50%;width:1.4rem;height:1.4rem;margin:-.7rem 0 0 -.7rem;border-radius:50%;background:#FFF6D8;
  box-shadow:0 0 1.2rem .5rem rgba(255,200,87,.9),0 0 4rem 1.6rem rgba(255,153,51,.6);opacity:0;animation:inSpark 1.5s ease forwards}
@keyframes inSpark{0%{opacity:0;-webkit-transform:scale(0);transform:scale(0)}25%{opacity:1;-webkit-transform:scale(1.4);transform:scale(1.4)}
  60%{opacity:1;-webkit-transform:scale(.8);transform:scale(.8)}100%{opacity:0;-webkit-transform:scale(5);transform:scale(5)}}
.in-glow{top:8%;left:8%;width:84%;height:84%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,120,.62) 0%,rgba(255,153,51,.24) 34%,rgba(255,153,51,0) 68%);opacity:0;animation:inGlow 2.4s 3.4s ease forwards}
@keyframes inGlow{0%{opacity:0;-webkit-transform:scale(.3);transform:scale(.3)}35%{opacity:1;-webkit-transform:scale(1.08);transform:scale(1.08)}100%{opacity:.8;-webkit-transform:scale(1);transform:scale(1)}}
/* official logo disc: grows behind the lotus, then a gold ring is drawn round it and a shine passes over */
.in-logo{top:31.94%;left:31.94%;width:36.11%;height:36.11%;border-radius:50%;overflow:hidden;
  box-shadow:0 0 0 .35rem rgba(255,200,87,.9),0 0 3.4rem rgba(255,153,51,.85),0 1.4rem 3rem rgba(0,0,0,.45);
  opacity:0;-webkit-transform:scale(.2);transform:scale(.2);animation:inDisc 1s 4.45s cubic-bezier(.2,1.25,.35,1) forwards}
@keyframes inDisc{0%{opacity:0;-webkit-transform:scale(.2);transform:scale(.2)}30%{opacity:1}100%{opacity:1;-webkit-transform:scale(1);transform:scale(1)}}
.in-logo img{width:100%;height:100%;object-fit:cover;display:block}
.in-logo svg{position:absolute;top:18%;left:18%;width:64%;height:64%}
.in-logo:after{content:'';position:absolute;top:-20%;left:-60%;width:40%;height:140%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));
  -webkit-transform:skewX(-20deg);transform:skewX(-20deg);animation:inShine 1.1s 5.6s ease-in-out forwards}
@keyframes inShine{to{left:130%}}
.in-ring{top:29.5%;left:29.5%;width:41%;height:41%;overflow:visible}
.in-ring circle{fill:none;stroke-width:.9;stroke-linecap:round}
.in-ring .r1{stroke:#FFC857;stroke-dasharray:1;stroke-dashoffset:1;animation:inRing 1.3s 5s cubic-bezier(.6,0,.2,1) forwards}
.in-ring .r2{stroke:rgba(255,200,87,.45);stroke-width:.35;stroke-dasharray:.6 2.2;opacity:0;-webkit-transform-origin:20px 20px;transform-origin:20px 20px;
  animation:inFade 1s 5.6s ease forwards,inSpin 40s linear infinite}
@keyframes inRing{to{stroke-dashoffset:0}}
/* the lotus: drawn in the same proportions as the lotus in the official logo.
   Full size while it blooms; .4333x and centred on the logo's lotus when it settles. */
.in-lotus{top:23.6%;left:26.26%;width:50%;height:53.33%;overflow:visible;
  -webkit-filter:drop-shadow(0 0 1.2rem rgba(255,200,87,.55));filter:drop-shadow(0 0 1.2rem rgba(255,200,87,.55));
  animation:inSettle 1.1s 4.45s cubic-bezier(.5,0,.2,1) forwards}
@keyframes inSettle{0%{-webkit-transform:scale(1);transform:scale(1);opacity:1}62%{opacity:1}100%{-webkit-transform:scale(.4333);transform:scale(.4333);opacity:0}}
.in-lotus .bud{opacity:0;-webkit-transform:translateY(40px);transform:translateY(40px);animation:inBud 1s 1.95s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes inBud{to{opacity:1;-webkit-transform:none;transform:none}}
.in-lotus .pt{fill:url(#inPetal);stroke:#FFC24A;stroke-width:2.2;stroke-linejoin:round;-webkit-transform-origin:120px 150px;transform-origin:120px 150px}
.in-lotus .vein{fill:none;stroke:rgba(230,81,0,.35);stroke-width:1.4;stroke-linecap:round}
.in-lotus .bowl{fill:url(#inPetal);stroke:#FFC24A;stroke-width:2.2;stroke-linejoin:round}
.in-lotus .stem{fill:none;stroke:#7BD389;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:inStem .9s 1.9s ease-out forwards}
.in-lotus .roots path{fill:none;stroke:#7BD389;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:inStem .6s 2.5s ease-out forwards}
@keyframes inStem{to{stroke-dashoffset:0}}
.in-lotus .wave{fill:none;stroke:#FFD27A;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:inStem .8s ease-out forwards}
.in-lotus .rip{fill:none;stroke:rgba(255,210,122,.8);stroke-width:1.6;opacity:0;-webkit-transform-origin:120px 236px;transform-origin:120px 236px;animation:inRip 2s ease-out forwards}
@keyframes inRip{0%{opacity:0;-webkit-transform:scale(.1);transform:scale(.1)}20%{opacity:.9}100%{opacity:0;-webkit-transform:scale(1.6);transform:scale(1.6)}}
/* petals: closed bud -> open; slight overshoot so it feels alive, not mechanical */
.in-lotus .pt{animation-duration:1.25s;animation-timing-function:cubic-bezier(.25,.9,.3,1.12);animation-fill-mode:both}
.in-lotus .o1{animation-name:inO1;animation-delay:2.55s}.in-lotus .o2{animation-name:inO2;animation-delay:2.55s}
.in-lotus .l1{animation-name:inL1;animation-delay:2.7s}.in-lotus .l2{animation-name:inL2;animation-delay:2.7s}
.in-lotus .i1{animation-name:inI1;animation-delay:2.85s}.in-lotus .i2{animation-name:inI2;animation-delay:2.85s}
.in-lotus .c0{animation-name:inC0;animation-delay:3.0s}
@keyframes inO1{from{-webkit-transform:rotate(-4deg) scale(.42,.62);transform:rotate(-4deg) scale(.42,.62)}to{-webkit-transform:rotate(-42deg);transform:rotate(-42deg)}}
@keyframes inO2{from{-webkit-transform:rotate(4deg) scale(.42,.62);transform:rotate(4deg) scale(.42,.62)}to{-webkit-transform:rotate(42deg);transform:rotate(42deg)}}
@keyframes inL1{from{-webkit-transform:rotate(-8deg) scale(.4,.5);transform:rotate(-8deg) scale(.4,.5)}to{-webkit-transform:rotate(-72deg);transform:rotate(-72deg)}}
@keyframes inL2{from{-webkit-transform:rotate(8deg) scale(.4,.5);transform:rotate(8deg) scale(.4,.5)}to{-webkit-transform:rotate(72deg);transform:rotate(72deg)}}
@keyframes inI1{from{-webkit-transform:rotate(-2deg) scale(.45,.66);transform:rotate(-2deg) scale(.45,.66)}to{-webkit-transform:rotate(-20deg);transform:rotate(-20deg)}}
@keyframes inI2{from{-webkit-transform:rotate(2deg) scale(.45,.66);transform:rotate(2deg) scale(.45,.66)}to{-webkit-transform:rotate(20deg);transform:rotate(20deg)}}
@keyframes inC0{from{-webkit-transform:scale(.5,.7);transform:scale(.5,.7)}to{-webkit-transform:none;transform:none}}
/* pollen burst from the heart of the flower + embers drifting up */
.in-burst{top:45.5%;left:51.3%;width:0;height:0}
.in-burst i{position:absolute;top:0;left:0;width:0;height:0}
.in-burst i b{position:absolute;top:-.3rem;left:-.3rem;width:.6rem;height:.6rem;border-radius:50%;background:#FFE7A3;box-shadow:0 0 .8rem .2rem rgba(255,180,60,.8);
  opacity:0;animation:inPollen 1.6s cubic-bezier(.1,.7,.3,1) forwards}
.in-burst i b.pe{width:.9rem;height:1.5rem;top:-.75rem;left:-.45rem;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:linear-gradient(#FFFFFF,#FFB866);box-shadow:none}
@keyframes inPollen{0%{opacity:0;-webkit-transform:translateY(0) scale(.4);transform:translateY(0) scale(.4)}15%{opacity:1}
  100%{opacity:0;-webkit-transform:translateY(-15rem) scale(1) rotate(160deg);transform:translateY(-15rem) scale(1) rotate(160deg)}}
.in-embers{top:0;left:0;right:0;bottom:0;position:absolute;overflow:hidden;pointer-events:none}
.in-embers i{position:absolute;bottom:-2rem;width:.45rem;height:.45rem;border-radius:50%;background:#FFD27A;box-shadow:0 0 .7rem .2rem rgba(255,153,51,.7);opacity:0;animation:inEmber linear infinite}
@keyframes inEmber{0%{opacity:0;-webkit-transform:translateY(0);transform:translateY(0)}12%{opacity:.85}80%{opacity:.5}100%{opacity:0;-webkit-transform:translateY(-70rem);transform:translateY(-70rem)}}
@keyframes inFade{to{opacity:1}}
@keyframes inSpin{to{-webkit-transform:rotate(360deg);transform:rotate(360deg)}}
/* wordmark: नज़र rises out of a slot, a gold shimmer runs through it; NAZAR tracks in */
.in-wm{margin-top:.6rem;text-align:center;position:relative;z-index:2}
.in-wm .slot{display:block;overflow:hidden;padding:0 1rem .4rem}
.in-wm b{display:inline-block;font-family:var(--deva);font-weight:800;font-size:7rem;line-height:1.12;color:#FFF3DC;
  background:linear-gradient(100deg,#FFF3DC 0%,#FFF3DC 40%,#FFC857 50%,#FFF3DC 60%,#FFF3DC 100%);background-size:250% 100%;background-position:100% 0;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;-webkit-filter:drop-shadow(0 .4rem 1.6rem rgba(230,81,0,.75));filter:drop-shadow(0 .4rem 1.6rem rgba(230,81,0,.75));
  -webkit-transform:translateY(110%);transform:translateY(110%);animation:inUp .9s 5.2s cubic-bezier(.2,.9,.25,1) forwards,inShimmer 1.6s 6s ease-in-out forwards}
@keyframes inUp{to{-webkit-transform:none;transform:none}}
@keyframes inShimmer{to{background-position:0 0}}
.in-wm .nz{display:block;font-family:var(--head);font-weight:700;font-size:2rem;letter-spacing:1.1rem;padding-left:1.1rem;color:var(--gold);margin-top:.2rem;
  opacity:0;animation:inTrack 1.2s 5.55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes inTrack{from{opacity:0;letter-spacing:3rem}to{opacity:1;letter-spacing:1.1rem}}
.in-wm .tri{display:block;width:16rem;height:.3rem;margin:1rem auto 0;border-radius:.3rem;
  background:linear-gradient(90deg,#FF9933 0%,#FF9933 33%,#FFFFFF 33%,#FFFFFF 66%,#138808 66%,#138808 100%);
  -webkit-transform:scaleX(0);transform:scaleX(0);animation:inBar .8s 5.9s ease forwards}
@keyframes inBar{to{-webkit-transform:scaleX(1);transform:scaleX(1)}}
.in-wm i{display:block;font-style:normal;font-size:1.6rem;color:var(--muted);margin-top:.9rem;opacity:0;animation:inRise .8s 6.1s ease forwards}
@keyframes inRise{from{opacity:0;-webkit-transform:translateY(1.2rem);transform:translateY(1.2rem)}to{opacity:1;-webkit-transform:none;transform:none}}
.in-stats{margin-top:2rem;min-height:6.5rem;display:flex;justify-content:center;position:relative;z-index:2}
.in-stat{margin:0 2.6rem;text-align:center;opacity:0;animation:inRise .7s ease forwards}
.in-stat b{display:block;font-family:var(--head);font-weight:700;font-size:4.4rem;color:var(--gold);line-height:1;text-shadow:0 0 1.6rem rgba(255,153,51,.45)}
.in-stat span{font-size:1.3rem;color:var(--muted)}
.in-skip{position:absolute;bottom:2rem;right:2.4rem;font-size:1.3rem;color:var(--dim)}
/* reduced motion: the finished picture, no movement */
body.reduced #intro *{-webkit-animation:none!important;animation:none!important}
body.reduced .in-map path{stroke-dashoffset:0;fill-opacity:.2} body.reduced .in-map{opacity:.55}
body.reduced .in-rays,body.reduced .in-glow,body.reduced .in-logo,body.reduced .in-ring .r2,body.reduced .in-wm .nz,body.reduced .in-wm i,body.reduced .in-stat{opacity:1;-webkit-transform:none;transform:none}
body.reduced .in-ring .r1{stroke-dashoffset:0} body.reduced .in-wm b,body.reduced .in-wm .tri{-webkit-transform:none;transform:none}
body.reduced .in-lotus,body.reduced .in-spark,body.reduced .in-burst,body.reduced .in-embers{display:none}

/* ---------- start screen ---------- */
#chooser{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;display:flex;flex-direction:column;padding:2.2rem 3.4rem}
.ch-top{display:flex;align-items:center;justify-content:space-between}
.ch-q{text-align:center;margin-top:1.4rem}
.ch-q h1{font-family:var(--deva);font-weight:800;font-size:4.6rem;line-height:1.1;text-shadow:0 .4rem 2rem rgba(0,0,0,.6)}
.ch-q p{font-size:1.7rem;color:var(--muted);margin-top:.6rem;text-shadow:0 .2rem .8rem rgba(0,0,0,.7)}
.ch-cards{margin-top:auto;display:flex;align-items:stretch;justify-content:center}
.ch-card{background:var(--glass);border:.12rem solid var(--line);border-radius:2rem;padding:2.4rem 2.6rem;box-shadow:0 2rem 5rem rgba(0,0,0,.45);text-align:left}
.ch-all{width:38rem;margin-right:2.4rem;cursor:pointer;transition:border-color .2s,-webkit-transform .2s;transition:border-color .2s,transform .2s;display:flex;flex-direction:column}
.ch-all:hover,.ch-all:focus{border-color:var(--gold);outline:none;-webkit-transform:translateY(-.3rem);transform:translateY(-.3rem)}
.ch-one{width:62rem}
/* state picker (inside the "full picture" card) + the state pill in the header */
.ch-st{margin-top:1.5rem;padding-top:1.3rem;border-top:.08rem solid rgba(255,200,87,.16)}
.ch-st-k{display:flex;align-items:center;font-family:var(--head),var(--deva);font-weight:700;font-size:1.3rem;letter-spacing:.14rem;text-transform:uppercase;color:var(--gold);margin-bottom:.9rem}
.ch-st-k svg{width:1.3rem;height:1.3rem;fill:var(--gold);margin-right:.6rem;flex:0 0 auto}
.ch-st-list{display:grid;grid-template-columns:1fr 1fr;grid-gap:.6rem;align-content:start}
/* a small India map next to the buttons: every state shaded by how active it is; click to choose */
.ch-all{width:50rem} .ch-one{width:54rem}
.ch-st-body{display:grid;grid-template-columns:16rem 1fr;grid-gap:1.4rem;align-items:start}
.ch-map svg{display:block;width:100%;height:17rem}
.ch-map path{stroke:rgba(255,214,140,.55);stroke-width:.7px;vector-effect:non-scaling-stroke;fill:rgba(255,255,255,.05);transition:fill .15s}
.ch-map path.ok{cursor:pointer}
.ch-map path.ok:hover,.ch-map path.hov{fill:#FFC857!important;stroke:#fff}
.ch-map path.on{fill:#FF9933!important;stroke:#fff;stroke-width:1.4px}
.ch-map-tip{margin-top:.5rem;min-height:1.6rem;font-size:1.3rem;font-weight:700;color:var(--gold);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.portrait .ch-st-body{grid-template-columns:1fr} body.portrait .ch-map svg{height:14rem}
.st-chip{display:flex;align-items:center;justify-content:space-between;height:3.4rem;padding:0 1rem 0 1.15rem;border-radius:.9rem;
  border:.08rem solid rgba(255,200,87,.18);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  color:var(--text);font-family:var(--deva);font-weight:700;font-size:1.35rem;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;
  transition:border-color .15s,background-color .15s,-webkit-transform .15s;transition:border-color .15s,background-color .15s,transform .15s}
.st-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:0}
/* the name always wins: in a narrow chip the post count gives way, never the state's name */
.ch-st-list{grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr))}
.st-chip small{min-width:0;overflow:hidden}
.st-chip small{flex:0 0 auto;font-family:var(--head);font-size:1.3rem;font-weight:600;color:var(--dim);margin-left:.6rem}
.st-chip:hover,.st-chip:focus{border-color:var(--gold);background-color:rgba(255,153,51,.18);outline:none;-webkit-transform:translateY(-.1rem);transform:translateY(-.1rem)}
.st-chip.on{background:linear-gradient(135deg,#E65100,#FF9933);border-color:transparent}
.st-chip.on small{color:rgba(255,255,255,.85)}
.st-chip.all{color:var(--gold)}
.st-chip.more{grid-column:1 / -1;justify-content:center;border-style:dashed;border-color:rgba(255,200,87,.45);color:var(--gold);background:rgba(255,153,51,.08)}
.st-chip.more svg{width:1.3rem;height:1.3rem;margin-left:.6rem;fill:none;stroke:var(--gold);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
/* all-states panel (replaces the browser's own drop-down, which TVs and Windows draw white-on-white) */
.st-panel{position:fixed;top:0;left:0;right:0;bottom:0;z-index:45;background:rgba(14,4,2,.8);display:flex;align-items:center;justify-content:center}
.st-box{width:100rem;max-width:94%;max-height:86%;display:flex;flex-direction:column;padding:2.4rem 2.6rem 2.6rem;border-radius:2rem;
  background:linear-gradient(180deg,#3d1407 0%,#220904 100%);border:.1rem solid rgba(255,200,87,.35);box-shadow:0 3rem 8rem rgba(0,0,0,.65),inset 0 .1rem 0 rgba(255,200,87,.2)}
.st-top{display:flex;align-items:center;margin-bottom:.6rem}
.st-top h2{flex:1 1 auto;font-family:var(--deva);font-weight:800;font-size:3rem;line-height:1.1}
.st-sub{font-size:1.35rem;color:var(--muted);margin-bottom:1.6rem}
.st-find{width:30rem;height:4.2rem;border-radius:1.1rem;border:.1rem solid var(--line);background:rgba(0,0,0,.35);padding:0 1.3rem;font-size:1.5rem;color:var(--text);outline:none;margin-right:1rem}
.st-find:focus{border-color:var(--gold)}
.st-x{width:4.2rem;height:4.2rem;border-radius:50%;border:.1rem solid var(--line);background:rgba(255,255,255,.06);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.st-x svg{width:1.8rem;height:1.8rem;fill:none;stroke:var(--text);stroke-width:2.4;stroke-linecap:round}
.st-x:hover,.st-x:focus{border-color:var(--gold);outline:none}
/* rows never shrink below their content (an overflow:hidden item may otherwise collapse when the list is long) */
.st-grid{flex:1 1 auto;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:max-content;align-content:start;grid-gap:.9rem;padding:.2rem .4rem .2rem .2rem}
.st-item{position:relative;overflow:hidden;text-align:left;padding:1.15rem 1.3rem 1.4rem;border-radius:1.1rem;cursor:pointer;color:var(--text);
  border:.08rem solid rgba(255,200,87,.16);background:rgba(255,255,255,.05);transition:border-color .15s,background-color .15s}
.st-item b{display:block;font-family:var(--deva);font-weight:700;font-size:1.55rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-item span{display:block;font-size:1.3rem;color:var(--dim);margin-top:.25rem}
.st-item i{position:absolute;left:0;bottom:0;height:.3rem;background:linear-gradient(90deg,#E65100,#FFC857)}
.st-item:hover,.st-item:focus{border-color:var(--gold);background-color:rgba(255,153,51,.16);outline:none}
.st-item.on{border-color:var(--gold);background-color:rgba(255,153,51,.26)}
.st-item.all b{color:var(--gold)}
.st-grid::-webkit-scrollbar{width:.6rem}
.st-grid::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:.6rem}
.st-grid::-webkit-scrollbar-thumb{background:rgba(255,200,87,.45);border-radius:.6rem}
.st-empty{grid-column:1 / -1;font-size:1.4rem;color:var(--dim);padding:1rem 0}
body.portrait .st-grid{grid-template-columns:1fr 1fr} body.portrait .st-find{width:auto;flex:1 1 auto;min-width:0}
body.portrait .st-top{flex-wrap:wrap} body.portrait .st-top h2{width:100%;margin-bottom:1rem}
.stpill{border-color:rgba(255,200,87,.6);background:rgba(255,153,51,.22);color:#FFE3A3}
.stpill svg{width:1.4rem;height:1.4rem;margin-right:.6rem;fill:var(--gold);flex:0 0 auto}
.ch-k{font-family:var(--head);font-weight:700;font-size:1.3rem;letter-spacing:.2rem;text-transform:uppercase;color:var(--gold)}
.ch-t{font-family:var(--deva);font-weight:800;font-size:3.4rem;line-height:1.15;margin-top:.5rem}
.ch-d{font-size:1.35rem;color:var(--muted);margin-top:.6rem;line-height:1.45}
.ch-go{margin-top:auto;padding-top:1.6rem;display:flex;align-items:center;font-weight:700;font-size:1.4rem;color:var(--gold)}
.ch-ring{width:3.6rem;height:3.6rem;margin-right:1rem}
.ch-ring circle{fill:none;stroke-width:3}
.ch-search{margin-top:1.4rem;position:relative}
.ch-search input{width:100%;height:5rem;border-radius:1.2rem;border:.12rem solid var(--line);background:rgba(0,0,0,.35);padding:0 1.6rem 0 4.6rem;font-size:1.8rem;outline:none}
.ch-search input:focus{border-color:var(--gold)}
.ch-search svg{position:absolute;left:1.5rem;top:1.45rem;width:2.1rem;height:2.1rem;opacity:.7}
.ch-list{margin-top:1rem;max-height:23rem;overflow-y:auto}
.ch-row{display:flex;align-items:center;padding:.9rem 1rem;border-radius:1rem;cursor:pointer}
.ch-row.on,.ch-row:hover{background:rgba(255,153,51,.16)}
.ch-row .av{width:4.6rem;height:4.6rem;font-size:1.7rem;margin-right:1.2rem;border-width:.18rem}
.ch-row .n{flex:1 1 auto;min-width:0}
.ch-row .n b{display:block;font-family:var(--head);font-weight:700;font-size:1.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-row .n span{font-size:1.3rem;color:var(--muted)}
.ch-row .pt{font-size:1.3rem;font-weight:700;padding:.25rem .8rem;border-radius:.5rem;color:#fff;margin-left:1rem}
.ch-hint{font-size:1.35rem;color:var(--dim);margin-top:1rem}
.ch-recent{margin-top:1rem;display:flex;flex-wrap:wrap}
.ch-recent button{margin:0 .8rem .8rem 0;padding:.6rem 1.2rem;border-radius:2rem;border:.08rem solid var(--line);background:rgba(255,255,255,.06);font-size:1.3rem;cursor:pointer}

/* ---------- shared bits ---------- */
.vc{display:flex;flex-direction:column;height:100%}
.vc > :first-child{margin-top:auto} .vc > :last-child{margin-bottom:auto}
.note{font-size:1.35rem;color:var(--dim);line-height:1.45;margin-top:1.2rem}
.av{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;color:#fff;overflow:hidden;flex:0 0 auto;border:.3rem solid}
.av img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.pl{display:inline-block;width:2.4rem;height:2.4rem;border-radius:50%;overflow:hidden;vertical-align:middle;flex:0 0 auto;box-shadow:0 0 0 .12rem rgba(255,255,255,.35)}
.pl img{width:100%;height:100%;object-fit:cover;display:block}
.dot{display:inline-block;width:1.1rem;height:1.1rem;border-radius:50%;flex:0 0 auto}

/* glance: poster -- leaders above, numbers strip below */
.glance{height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);grid-gap:1.6rem}
.kpi{background:var(--glass);border:.08rem solid var(--line);border-radius:1.6rem;padding:1.8rem 2rem;min-width:0;box-shadow:0 1.6rem 3rem rgba(0,0,0,.4)}
.kpi-v{font-family:var(--head);font-weight:700;font-size:5.6rem;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v.txt{font-size:3.6rem;line-height:1.05;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kpi-v .u{font-size:.55em;margin-left:.15em}
.kpi-l{font-size:1.4rem;color:var(--muted);margin-top:.8rem;font-weight:500}
.kpi-s{font-size:1.3rem;color:var(--dim);margin-top:.4rem}
.kpi-s .up{color:var(--good)} .kpi-s .down{color:var(--amber)}
.bar-sub .up{color:var(--good);font-weight:700} .bar-sub .down{color:var(--amber);font-weight:700}
.scale{margin-top:1.4rem;text-align:center;font-size:1.5rem;color:var(--muted);text-shadow:0 .2rem .8rem rgba(0,0,0,.8)}
.scale b{font-family:var(--head);font-size:2.1rem;color:var(--text);font-weight:700}
/* glance highlights: fills the space left of Modi ji, above the tiles. Its width
   stops short of Modi ji's figure (centre 50vw, about 24vh to each side). */
.gh{flex:0 0 auto;margin:auto 0 1.4rem;width:calc(50vw - 24vh - 5.4rem);max-width:38rem;min-width:24rem;
  background:linear-gradient(135deg,rgba(24,7,3,.95),rgba(24,7,3,.9));border:.08rem solid var(--line);border-left:.35rem solid #FF9933;
  border-radius:1.6rem;padding:.5rem 1.6rem;box-shadow:0 1.6rem 3rem rgba(0,0,0,.4);
  -webkit-animation:rise .7s .2s cubic-bezier(.2,.8,.2,1) both;animation:rise .7s .2s cubic-bezier(.2,.8,.2,1) both}
.gh-r{display:flex;align-items:center;padding:.6rem 0}
.gh-r + .gh-r{border-top:.08rem solid var(--line)}
.gh-r .av{width:4rem;height:4rem;font-size:1.4rem;border-width:.18rem;margin-right:1.1rem}
.gh-t{min-width:0;flex:1 1 auto;line-height:1.25}
.gh-t span{display:block;font-size:1.3rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-t b{display:block;font-size:1.55rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-t i{display:block;font-style:normal;font-size:1.3rem;font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* glance with five tiles: posts, views, likes, party, state */
.kpis.k5{grid-template-columns:repeat(5,1fr);grid-gap:1.3rem}
.kpis.k5 .kpi{padding:1.6rem 1.7rem} .kpis.k5 .kpi-v{font-size:5rem} .kpis.k5 .kpi-v.txt{font-size:3.2rem}
.kpi{position:relative}
.kpis .kpi{-webkit-animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.kpis .kpi:nth-child(2){-webkit-animation-delay:.08s;animation-delay:.08s} .kpis .kpi:nth-child(3){-webkit-animation-delay:.16s;animation-delay:.16s}
.kpis .kpi:nth-child(4){-webkit-animation-delay:.24s;animation-delay:.24s} .kpis .kpi:nth-child(5){-webkit-animation-delay:.32s;animation-delay:.32s}
@-webkit-keyframes rise{from{opacity:0;-webkit-transform:translateY(2.4rem) scale(.96)}to{opacity:1;-webkit-transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(2.4rem) scale(.96)}to{opacity:1;transform:none}}
/* everything we have, since the first day: one glass band under the tiles */
.atb{margin-top:1.3rem;background:linear-gradient(90deg,rgba(230,81,0,.30),rgba(24,7,3,.94) 30%,rgba(24,7,3,.94) 70%,rgba(19,136,8,.22));
  border:.08rem solid rgba(255,200,87,.38);border-radius:1.4rem;padding:1rem 1.8rem;display:flex;align-items:center;
  box-shadow:0 1.2rem 2.6rem rgba(0,0,0,.4);-webkit-animation:rise .7s .4s cubic-bezier(.2,.8,.2,1) both;animation:rise .7s .4s cubic-bezier(.2,.8,.2,1) both}
.atb-h{font-size:1.35rem;font-weight:700;color:var(--gold);letter-spacing:.04rem;text-transform:uppercase;white-space:nowrap;padding-right:1.8rem;margin-right:1.8rem;border-right:.08rem solid var(--line)}
.atb-h small{display:block;font-size:1.3rem;color:var(--dim);text-transform:none;letter-spacing:0;font-weight:500;margin-top:.2rem}
.atb-r{display:flex;flex:1 1 auto;justify-content:space-around;min-width:0}
.atb-i{text-align:center;padding:0 .8rem;min-width:0;position:relative;border-radius:1rem}
.atb-i b{display:block;font-family:var(--head);font-weight:700;font-size:3rem;line-height:1.05;white-space:nowrap}
.atb-i b .u{font-size:.6em;margin-left:.12em}
.atb-i span{font-size:1.3rem;color:var(--muted);white-space:nowrap}
/* live change: the number counts to its new value, glows, and a "+N" badge pops in */
.dlt{display:none;font-family:var(--body);font-weight:700;font-size:1.3rem;line-height:1;padding:.35rem .7rem;border-radius:2rem;white-space:nowrap;vertical-align:middle}
.dlt.up,.dlt.down{display:inline-block;-webkit-animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.dlt.up{color:#0b2a12;background:var(--good);box-shadow:0 0 1.2rem rgba(123,211,137,.55)}
.dlt.down{color:#2a1a00;background:var(--amber)}
.kpi .dlt{position:absolute;top:1.1rem;right:1.1rem}
.atb-i .dlt{position:absolute;top:-1.1rem;right:-.4rem;font-size:1.2rem}
@-webkit-keyframes pop{0%{opacity:0;-webkit-transform:scale(.4) translateY(.8rem)}100%{opacity:1;-webkit-transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4) translateY(.8rem)}100%{opacity:1;transform:none}}
.bump{-webkit-animation:bump 1.8s ease-out;animation:bump 1.8s ease-out}
@-webkit-keyframes bump{0%{box-shadow:0 0 0 .2rem rgba(255,200,87,.9),0 0 3rem rgba(255,153,51,.75)}100%{box-shadow:0 0 0 0 rgba(255,200,87,0),0 1.6rem 3rem rgba(0,0,0,.4)}}
@keyframes bump{0%{box-shadow:0 0 0 .2rem rgba(255,200,87,.9),0 0 3rem rgba(255,153,51,.75)}100%{box-shadow:0 0 0 0 rgba(255,200,87,0),0 1.6rem 3rem rgba(0,0,0,.4)}}
.ticking{color:var(--gold);text-shadow:0 0 1.6rem rgba(255,200,87,.7)}
body.reduced .kpis .kpi,body.reduced .atb,body.reduced .bj-card,body.reduced .bj-row,body.reduced .dlt,body.reduced .bump{-webkit-animation:none;animation:none}

/* focus party (BJP): totals card on the left, one row per account category on the right */
.bj{display:grid;grid-template-columns:31% 1fr;grid-gap:1.8rem;height:100%;min-height:0}
.bj-card{background:linear-gradient(165deg,rgba(255,153,51,.30),rgba(26,8,3,.90) 55%);border:.08rem solid rgba(255,200,87,.5);border-radius:1.8rem;
  padding:2rem 2.2rem;display:flex;flex-direction:column;min-width:0;box-shadow:0 1.6rem 3rem rgba(0,0,0,.45);
  -webkit-animation:cardIn .8s cubic-bezier(.2,.8,.2,1) both;animation:cardIn .8s cubic-bezier(.2,.8,.2,1) both}
@-webkit-keyframes cardIn{from{opacity:0;-webkit-transform:translateX(-3rem) scale(.97)}to{opacity:1;-webkit-transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateX(-3rem) scale(.97)}to{opacity:1;transform:none}}
.bj-hd{display:flex;align-items:center}
.bj-hd .pl,.bj-hd .dot{width:6rem;height:6rem;margin-right:1.4rem;box-shadow:0 0 0 .25rem rgba(255,200,87,.7),0 0 2.4rem rgba(255,153,51,.6)}
.bj-n{font-family:var(--head);font-weight:700;font-size:4.2rem;line-height:1}
.bj-sh{font-size:1.35rem;color:var(--muted);margin-top:.3rem}
.bj-k{display:grid;grid-template-columns:1fr 1fr;grid-gap:1.4rem 1.6rem;margin-top:auto;padding-top:1.6rem}
.bj-k > div{position:relative;min-width:0}
.bj-k b{display:block;font-family:var(--head);font-weight:700;font-size:4rem;line-height:1;white-space:nowrap}
.bj-k b .u{font-size:.55em;margin-left:.12em}
.bj-k .bj-l{display:block;font-size:1.35rem;color:var(--muted);margin-top:.35rem}
.bj-k i{display:block;font-style:normal;font-size:1.3rem;margin-top:.25rem;color:var(--dim)}
.bj-k i .up{color:var(--good);font-weight:700} .bj-k i .down{color:var(--amber);font-weight:700}
.bj-k .dlt{position:absolute;top:-.6rem;right:0}
.bj-ft{font-size:1.3rem;color:var(--dim);margin-top:1.3rem;padding-top:1rem;border-top:.08rem solid var(--line)}
/* the rows always fit the height there is (a browser window with its tab bar and the taskbar is
   much shorter than a TV): they give up their spare padding first, and should even that not be
   enough the list starts at the top ("safe"), so the first row is never cut, only the last */
.bj-cats{display:flex;flex-direction:column;justify-content:center;justify-content:safe center;min-width:0;min-height:0;overflow:hidden}
.bj-cats .bj-row{flex:0 1 auto;min-height:0}
.bj-row{display:grid;grid-template-columns:17rem 1fr 19rem;align-items:center;background:var(--glass);border:.08rem solid var(--line);border-radius:1.2rem;
  padding:.75rem 1.3rem;margin-bottom:.7rem;min-width:0;position:relative;
  -webkit-animation:rowIn .6s cubic-bezier(.2,.8,.2,1) both;animation:rowIn .6s cubic-bezier(.2,.8,.2,1) both}
/* the rows rise into place (a slide from the right was cut by the list's edge, so the leader's
   name on the right looked clipped for a moment) */
@-webkit-keyframes rowIn{from{opacity:0;-webkit-transform:translateY(.9rem)}to{opacity:1;-webkit-transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(.9rem)}to{opacity:1;transform:none}}
.bj-row:last-child{margin-bottom:0}
.bj-c b{display:block;font-family:var(--head);font-weight:700;font-size:2.1rem;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bj-c span{font-size:1.3rem;color:var(--dim);white-space:nowrap}
.bj-m{min-width:0;padding:0 1.4rem}
.bj-m .bar-track{height:1.2rem}
.bj-nums{display:flex;align-items:baseline;margin-top:.45rem;font-size:1.3rem;color:var(--muted);white-space:nowrap;overflow:hidden}
.bj-nums b{font-family:var(--head);font-weight:700;font-size:2rem;color:var(--text);margin-right:.35rem}
.bj-nums em{font-style:normal;margin:0 1.1rem 0 0}
.bj-nums .up{color:var(--good);font-weight:700} .bj-nums .down{color:var(--amber);font-weight:700}
.bj-nums .dlt{margin-left:.6rem}
.bj-top{display:flex;align-items:center;min-width:0}
.bj-top .av{width:4rem;height:4rem;font-size:1.4rem;border-width:.16rem;margin-right:.9rem}
.bj-top div{min-width:0}
.bj-top b{display:block;font-size:1.3rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bj-top span{font-size:1.3rem;color:var(--dim);white-space:nowrap}

/* bars */
.bar-row{display:grid;grid-template-columns:14rem 1fr 14rem;align-items:center;margin-bottom:1.1rem}
.bar-name{display:flex;align-items:center;font-family:var(--head);font-weight:700;font-size:2.4rem;white-space:nowrap;overflow:hidden}
.bar-name .pl,.bar-name .dot{margin-right:.9rem}
.bar-mid{min-width:0;padding:0 1.6rem}
.bar-val{font-family:var(--head);font-weight:700;font-size:2.6rem;text-align:right;white-space:nowrap}
.bar-val small{font-size:1.4rem;color:var(--muted);font-weight:600;margin-left:.6rem}
.bar-track{height:1.7rem;border-radius:1rem;background:rgba(255,255,255,.08);overflow:hidden}
.bar-fill{height:100%;width:0;border-radius:1rem;transition:width 1.4s cubic-bezier(.3,.7,.2,1)}
body.reduced .bar-fill{transition:none}
.bar-sub{font-size:1.3rem;color:var(--dim);margin-top:.4rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sub .ltd{color:var(--amber)}
.bar-row.others .bar-name,.bar-row.others .bar-val{color:var(--muted)}

/* leaders */
.leads{display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-gap:1.8rem;height:100%}
.lead{background:var(--glass);border:.08rem solid var(--line);border-radius:1.8rem;padding:2.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0;box-shadow:0 1.6rem 3rem rgba(0,0,0,.4)}
.lead-1{background:linear-gradient(180deg,rgba(255,153,51,.24),rgba(24,7,3,.94));border-color:rgba(255,200,87,.5)}
/* three card levels: feature (the #1 of a screen: lit along its top edge), standard (--glass), inline (rows inside a card).
   The attack cards and official news keep their own top bar (severity / official), so they are left out. */
.lead-1,.bj-card,.bo-main{position:relative}
.lead-1:before,.bj-card:before,.bo-main:before,.mr-c.mr-lead:not(.off):before{content:'';position:absolute;top:-.08rem;left:10%;right:10%;height:.34rem;border-radius:0 0 .6rem .6rem;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,200,87,0),var(--edge) 28%,#FFF1C9 50%,var(--edge) 72%,rgba(255,200,87,0));box-shadow:0 0 2.2rem .2rem rgba(255,200,87,.6)}
.bo-main:before{background:linear-gradient(90deg,rgba(123,211,137,0),#7BD389 28%,#DDF7E2 50%,#7BD389 72%,rgba(123,211,137,0));box-shadow:0 0 2.2rem .2rem rgba(123,211,137,.55)}
.rank{font-family:var(--head);font-weight:700;font-size:1.5rem;color:var(--gold);margin-bottom:1rem;letter-spacing:.1rem}
.lead .av{width:11rem;height:11rem;font-size:4rem}
.lead-1 .av{width:13.5rem;height:13.5rem;font-size:4.8rem}
.ln{font-family:var(--head);font-weight:700;font-size:2.3rem;line-height:1.1;margin-top:1.4rem;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lead-1 .ln{font-size:2.8rem}
.ls{font-size:1.35rem;color:var(--muted);margin-top:.4rem}
.lv{font-family:var(--head);font-weight:700;font-size:4.4rem;color:var(--gold);line-height:1;margin-top:1.4rem}
.lead-1 .lv{font-size:5.4rem}
.ll{font-size:1.35rem;color:var(--dim);margin-top:.4rem}

/* breakout */
.bo{display:grid;grid-template-columns:1.5fr 1fr;grid-gap:2.2rem;height:100%}
.bo-main{background:linear-gradient(135deg,rgba(123,211,137,.18),rgba(24,7,3,.94));border:.08rem solid rgba(123,211,137,.4);border-radius:1.8rem;padding:2.8rem;display:flex;align-items:center}
.bo-main .av{width:14rem;height:14rem;font-size:5rem;margin-right:2.6rem}
.bo-x{font-family:var(--head);font-weight:700;font-size:9rem;line-height:.9;color:var(--good)}
.bo-xl{font-size:1.6rem;color:var(--muted);margin-top:.6rem}
.bo-nm{font-family:var(--head);font-weight:700;font-size:3rem;line-height:1.1;margin-top:1.4rem}
.bo-meta{font-size:1.3rem;color:var(--muted);margin-top:.4rem}
.bo-detail{font-size:1.35rem;color:var(--dim);margin-top:1rem;line-height:1.45}
.bo-more{min-width:0}
.bo-row{display:flex;align-items:center;background:var(--glass);border:.08rem solid var(--line);border-radius:1.2rem;padding:1.4rem 1.6rem;margin-bottom:1.2rem}
.bo-row .av{width:5.4rem;height:5.4rem;font-size:2rem;margin-right:1.3rem;border-width:.2rem}
.bo-row .n{flex:1 1 auto;min-width:0}
.bo-row .n b{display:block;font-family:var(--head);font-size:1.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bo-row .n span{font-size:1.3rem;color:var(--muted)}
.bo-row .x{font-family:var(--head);font-weight:700;font-size:2.8rem;color:var(--good);margin-left:1rem}

/* post */
/* biggest attacks on BJP / the governments -- a threat board: #1 down the left like a lead
   story (who attacked, how hard, whom, their words, the AI's one-line summary), #2 top right,
   the next ones as a list under it. Severity is a coloured badge: 5 red, 4 orange, 3 amber. */
.ak{display:grid;grid-template-columns:1.25fr 1fr;grid-gap:1.6rem;height:100%}
.ak-r{display:flex;flex-direction:column;min-height:0;min-width:0}
.ak-c{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;padding:1.8rem 2rem 1.6rem;border-radius:1.6rem;
  background:linear-gradient(180deg,rgba(42,13,4,.94),rgba(24,7,2,.94));border:.08rem solid rgba(255,153,51,.22);box-shadow:0 1.6rem 3.4rem rgba(0,0,0,.4),inset 0 .08rem 0 rgba(255,200,87,.1)}
.ak-c:after{content:'';position:absolute;top:0;left:0;right:0;height:.35rem;background:var(--sevc,#FF7043)}
.ak-c.ak-lead{padding:2.4rem 2.6rem 2.2rem;background:linear-gradient(160deg,rgba(255,61,0,.16) 0%,rgba(46,14,4,.95) 36%,rgba(24,7,2,.95) 100%);border-color:rgba(255,138,101,.4)}
/* the #2 card keeps its full height (shrunk, its quote was cut through the middle of a line);
   the list under it gives way instead, a whole row at a time (fitLists) */
.ak-r .ak-c{flex:0 0 auto;margin-bottom:1.4rem}
.ak-top{display:flex;align-items:center;flex-wrap:wrap;flex:0 0 auto}
.ak-top > *{margin:0 .7rem .5rem 0}
.ak-rk{font-family:var(--head);font-weight:700;font-size:2.3rem;line-height:1;color:var(--gold)}
.ak-sev{display:inline-flex;align-items:baseline;padding:.35rem .9rem .3rem;border-radius:.7rem;background:var(--sevc,#FF7043);color:#fff;font-family:var(--head);font-weight:700;white-space:nowrap;
  box-shadow:0 .3rem 1rem rgba(0,0,0,.3)}
.ak-sev b{font-size:1.8rem;line-height:1} .ak-sev small{font-family:var(--deva);font-size:1.3rem;margin-left:.35rem;opacity:.92}
.ak-tg,.ak-tp{display:inline-block;font-size:1.35rem;font-weight:700;padding:.4rem 1rem;border-radius:2rem;white-space:nowrap;font-family:var(--deva)}
.ak-tg{background:rgba(255,61,0,.18);color:#FFB199;border:.08rem solid rgba(255,112,67,.5)}
.ak-tp{background:rgba(255,255,255,.08);color:var(--muted)}
.ak-who{display:flex;align-items:center;margin-top:1.2rem;flex:0 0 auto;min-width:0}
.ak-who .av{width:4.8rem;height:4.8rem;font-size:1.8rem;margin-right:1.2rem;border-width:.18rem}
.ak-lead .ak-who{margin-top:1.8rem} .ak-lead .ak-who .av{width:7rem;height:7rem;font-size:2.6rem;border-width:.25rem;margin-right:1.6rem}
.ak-who .n{flex:1 1 auto;min-width:0}
.ak-who b{display:block;font-family:var(--head),var(--deva);font-size:2.1rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ak-lead .ak-who b{font-size:2.9rem}
.ak-who .n > span{display:flex;align-items:center;margin-top:.35rem;font-size:1.35rem;color:var(--muted);white-space:nowrap;overflow:hidden}
.ak-pt{display:inline-block;flex:0 0 auto;font-style:normal;font-size:1.3rem;font-weight:700;padding:.15rem .6rem;border-radius:.4rem;color:#fff;margin-right:.6rem;font-family:var(--head)}
.ak-who .v{flex:0 0 auto;margin-left:1rem;text-align:right}
.ak-who .v b{font-family:var(--head);font-size:2.4rem;color:var(--gold);line-height:1}
.ak-lead .ak-who .v b{font-size:3.4rem}
.ak-who .v span{display:block;font-size:1.3rem;color:var(--dim);margin-top:.2rem}
/* the quote keeps whole lines (fitAttackCards gives lines up when space is short) */
.ak-q{flex:0 0 auto;margin-top:1.2rem;font-size:2rem;line-height:1.4;font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ak-lead .ak-q{margin-top:2rem;font-size:2.9rem;line-height:1.36;font-weight:600;-webkit-line-clamp:5}
.ak-s{flex:0 0 auto;margin-top:auto;padding-top:1.2rem}
.ak-s div{padding:.9rem 1.2rem;border-radius:1rem;background:rgba(255,255,255,.05);border:.08rem solid rgba(255,200,87,.14);font-size:1.35rem;line-height:1.45;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ak-lead .ak-s div{font-size:1.45rem}
.ak-s em{font-style:normal;color:var(--gold);font-weight:700;margin-right:.4rem}
.ak-l{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.ak-lh{flex:0 0 auto;font-family:var(--head),var(--deva);font-weight:700;font-size:1.35rem;letter-spacing:.14rem;text-transform:uppercase;color:var(--gold);margin-bottom:.7rem}
.ak-row{flex:0 0 auto;display:flex;align-items:center;padding:.9rem 1.1rem;margin-bottom:.7rem;border-radius:1.1rem;background:rgba(24,7,3,.94);border:.08rem solid rgba(255,153,51,.2)}
.ak-row .r{font-family:var(--head);font-weight:700;font-size:1.6rem;color:var(--dim);width:2.4rem;flex:0 0 auto}
.ak-row .av{width:4rem;height:4rem;font-size:1.5rem;margin-right:1rem;border-width:.15rem;flex:0 0 auto}
.ak-row .n{flex:1 1 auto;min-width:0}
.ak-row .n b{display:flex;align-items:center;font-family:var(--head),var(--deva);font-size:1.65rem;line-height:1.2;white-space:nowrap;overflow:hidden}
.ak-row .n b .ak-pt{margin:0 0 0 .6rem}
.ak-row .n > span{display:block;font-size:1.35rem;line-height:1.35;color:var(--muted);margin-top:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ak-row .n > span em{font-style:normal;font-weight:700;color:#FFB199}
.ak-row .x{flex:0 0 auto;margin-left:.9rem;min-width:3rem;text-align:center;font-family:var(--head);font-weight:700;font-size:1.7rem;padding:.25rem .6rem;border-radius:.6rem;color:#fff;background:var(--sevc,#FF7043)}
.ak-note{flex:0 0 auto;margin-top:auto;padding-top:.4rem;font-size:1.3rem;color:var(--dim);line-height:1.4}
body.portrait .ak{grid-template-columns:1fr;grid-template-rows:auto 1fr}
.tp-q{font-size:3rem;line-height:1.4;font-weight:500;border-left:.5rem solid var(--saffron);padding-left:2.4rem;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.tp-by{display:flex;align-items:center;margin-top:2.2rem}
.tp-by .av{width:6.4rem;height:6.4rem;font-size:2.3rem;margin-right:1.4rem;border-width:.22rem}
.tp-by b{display:block;font-family:var(--head);font-size:2.4rem}
.tp-by span{font-size:1.3rem;color:var(--muted)}
.tp-v{margin-left:auto;text-align:right}
.tp-v b{font-family:var(--head);font-size:4.6rem;color:var(--gold);line-height:1}
.tp-v span{display:block;font-size:1.35rem;color:var(--dim)}

/* map */
.mapw{display:grid;grid-template-columns:1.25fr 1fr;grid-gap:2.4rem;height:100%}
.map-svg{min-height:0;height:100%;display:flex;align-items:center;justify-content:center}
.map-svg svg{height:100%;width:100%;max-height:100%}
.map-svg path{stroke:rgba(20,6,2,.95);stroke-width:.05;transition:opacity .4s}
.map-svg path.hl{stroke:#fff;stroke-width:.12}
.map-svg.dimmed path{opacity:.42} .map-svg.dimmed path.hl{opacity:1}
.map-side{min-width:0}
.ms-row{display:flex;align-items:center;padding:.95rem 1.2rem;border-radius:1rem;margin-bottom:.4rem;transition:background .3s}
.ms-row.hl{background:rgba(255,153,51,.16)}
.ms-row .r{font-family:var(--head);font-weight:700;font-size:1.6rem;color:var(--dim);width:2.6rem}
.ms-row .s{flex:1 1 auto;font-family:var(--head);font-weight:700;font-size:2.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-row .p{font-size:1.35rem;font-weight:700;padding:.2rem .7rem;border-radius:.4rem;margin:0 1rem;color:#fff}
.ms-row .v{font-family:var(--head);font-weight:700;font-size:2rem}
.legend{display:flex;flex-wrap:wrap;margin-top:1.4rem}
.legend span{display:flex;align-items:center;font-size:1.3rem;color:var(--muted);margin:0 1.4rem .6rem 0}
.legend i{width:1rem;height:1rem;border-radius:.25rem;margin-right:.5rem}

/* facts */
.facts{list-style:none;max-width:130rem}
.facts li{display:flex;align-items:flex-start;font-size:2.6rem;line-height:1.35;margin-bottom:1.8rem}
.facts li i{flex:0 0 auto;width:1rem;height:1rem;border-radius:50%;background:var(--saffron);margin:1.25rem 1.6rem 0 0}
.facts li b{color:var(--gold);font-weight:700}

/* personal: profile */
.pf{display:grid;grid-template-columns:auto 1fr;grid-gap:3rem;align-items:center;height:100%}
.pf-av .av{width:20rem;height:20rem;font-size:7rem;border-width:.45rem;box-shadow:0 0 0 .6rem rgba(255,153,51,.25),0 2rem 4rem rgba(0,0,0,.5)}
.pf-nm{font-family:var(--head);font-weight:700;font-size:5rem;line-height:1.02}
.pf-meta{display:flex;align-items:center;flex-wrap:wrap;font-size:1.6rem;color:var(--muted);margin-top:.8rem}
.pf-meta > *{margin:0 1rem .4rem 0}
.pf-meta .pt{font-weight:700;padding:.2rem .8rem;border-radius:.5rem;color:#fff}
.pf-k{display:grid;grid-template-columns:repeat(4,1fr);grid-gap:1.2rem;margin-top:2rem}
.pf-k div{background:rgba(0,0,0,.25);border:.08rem solid var(--line);border-radius:1.2rem;padding:1.3rem 1.5rem}
.pf-k b{display:block;font-family:var(--head);font-weight:700;font-size:4rem;line-height:1}
.pf-k span{font-size:1.35rem;color:var(--muted)}
.pf-chips{margin-top:1.4rem;display:flex;flex-wrap:wrap}
.pf-chips span{font-size:1.3rem;font-weight:700;padding:.5rem 1.1rem;border-radius:2rem;margin:0 1rem .6rem 0;background:rgba(255,255,255,.08)}
.pf-chips .up{color:var(--good);background:rgba(123,211,137,.14)} .pf-chips .down{color:var(--amber);background:rgba(255,179,0,.14)}
/* personal: rhythm */
.rh{display:grid;grid-template-columns:1.6fr 1fr;grid-gap:2.4rem;height:100%}
.rh h4{font-family:var(--head);font-size:1.8rem;color:var(--gold);margin-bottom:1.2rem}
.hbars{display:flex;align-items:flex-end;height:22rem}
.hbars div{flex:1 1 0;margin:0 .12rem;background:linear-gradient(180deg,#FFC857,#E65100);border-radius:.4rem .4rem 0 0;min-height:.2rem}
.hlab{display:flex;justify-content:space-between;font-size:1.3rem;color:var(--dim);margin-top:.5rem}
.dbars{display:flex;align-items:flex-end;height:22rem}
.dbars div{flex:1 1 0;margin:0 .5rem;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.dbars i{display:block;background:linear-gradient(180deg,#FF9933,#9E3600);border-radius:.5rem .5rem 0 0;min-height:.2rem}
.dbars b{font-family:var(--head);font-size:1.6rem;margin-bottom:.3rem}
.dbars span{font-size:1.3rem;color:var(--dim);margin-top:.4rem}
.dbars .nod b{color:var(--dim)}
/* personal: ranks */
.rk{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:2rem;height:100%}
.rk div{background:var(--glass);border:.08rem solid var(--line);border-radius:1.8rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
.rk b{font-family:var(--head);font-weight:700;font-size:9rem;line-height:1;color:var(--gold)}
.rk b small{font-size:.35em;color:var(--muted);margin-left:.3rem}
.rk span{font-size:1.6rem;color:var(--muted);margin-top:.8rem}
/* personal: rivals, colleagues, news */
.rv{display:grid;grid-template-columns:repeat(2,1fr);grid-gap:1.4rem}
.rv-c{background:var(--glass);border:.08rem solid var(--line);border-radius:1.4rem;padding:1.5rem 1.7rem;min-width:0}
.rv-h{display:flex;align-items:center}
.rv-h .av{width:5.4rem;height:5.4rem;font-size:2rem;margin-right:1.2rem;border-width:.2rem}
.rv-h b{display:block;font-family:var(--head);font-size:2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-h span{font-size:1.3rem;color:var(--muted)}
.rv-n{display:flex;margin-top:1rem}
.rv-n div{margin-right:2.4rem} .rv-n b{font-family:var(--head);font-size:2.6rem;color:var(--gold)} .rv-n span{display:block;font-size:1.3rem;color:var(--dim)}
.rv-q{font-size:1.3rem;color:var(--muted);margin-top:.8rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nw li{list-style:none;display:flex;align-items:flex-start;padding:1.1rem 0;border-bottom:.08rem solid var(--line)}
.nw li:last-child{border-bottom:0}
.nw .tk-tag{flex:0 0 auto;margin-top:.25rem}
.nwg.two{display:grid;grid-template-columns:1fr 1fr;grid-gap:2.6rem}
.nw p{font-size:1.75rem;line-height:1.35;min-width:0}
.nw p em{font-style:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nw p span{display:block;font-size:1.3rem;color:var(--dim);margin-top:.3rem}
.nw h4{font-family:var(--head);font-size:1.8rem;color:var(--gold);margin:0 0 .6rem}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.empty h3{font-family:var(--head);font-size:3.6rem}
.empty p{font-size:1.6rem;color:var(--muted);margin-top:1rem;max-width:70rem;line-height:1.5}
.ldr{width:22rem;height:.4rem;border-radius:.4rem;margin:0 auto 2.4rem;overflow:hidden;background:rgba(255,255,255,.12)}
.ldr i{display:block;width:40%;height:100%;background:linear-gradient(90deg,#E65100,#FFC857);animation:ldr 1.4s ease-in-out infinite}
@keyframes ldr{0%{margin-left:-40%}100%{margin-left:100%}}
body.reduced .ldr i{animation:none;width:100%;opacity:.6}

/* ---------- Media Room: news cards, latest per source, the "what to show" panel ---------- */
/* the news wall: one lead story down the left, up to four more beside it */
.mr-w{display:grid;grid-template-columns:1.45fr 1fr 1fr;grid-template-rows:1fr 1fr;grid-gap:1.4rem;height:100%}
.mr-w .mr-c:first-child{grid-column:1;grid-row:1 / 3}
.mr-w.n1{grid-template-columns:1fr;grid-template-rows:1fr}
.mr-w.n2,.mr-w.n3{grid-template-columns:1.45fr 1fr}
.mr-w.n2 .mr-c:nth-child(2){grid-row:1 / 3}
.mr-w.n4 .mr-c:nth-child(2){grid-column:2;grid-row:1} .mr-w.n4 .mr-c:nth-child(3){grid-column:2;grid-row:2} .mr-w.n4 .mr-c:nth-child(4){grid-column:3;grid-row:1 / 3}
.mr-c{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;padding:1.6rem 1.8rem 1.4rem;border-radius:1.6rem;color:var(--text);text-decoration:none;
  background:linear-gradient(180deg,rgba(42,13,4,.92),rgba(24,7,2,.92));border:.08rem solid rgba(255,153,51,.2);box-shadow:0 1.6rem 3.4rem rgba(0,0,0,.4),inset 0 .08rem 0 rgba(255,200,87,.1)}
.mr-c.mr-lead{padding:2.4rem 2.6rem 2rem;border-color:rgba(255,200,87,.4);
  background:linear-gradient(160deg,rgba(255,153,51,.2) 0%,rgba(46,14,4,.94) 34%,rgba(24,7,2,.94) 100%)}
.mr-c.off{border-color:rgba(255,200,87,.6)}
.mr-c.off:after{content:'';position:absolute;top:0;left:0;right:0;height:.32rem;background:linear-gradient(90deg,#FFC857,#FF9933)}
.mr-h{display:flex;align-items:center;flex:0 0 auto;min-width:0}
.mr-lg{position:relative;flex:0 0 auto;width:3.4rem;height:3.4rem;border-radius:.8rem;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-right:1rem;
  box-shadow:0 0 0 .1rem rgba(255,255,255,.2)}
.mr-lg i{font-style:normal;font-family:var(--head),var(--deva);font-weight:700;font-size:1.3rem;color:#fff;letter-spacing:.03rem}
.mr-lg img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;background:#fff}
.mr-lead .mr-h .mr-lg{width:4.8rem;height:4.8rem;border-radius:1.1rem;margin-right:1.3rem} .mr-lead .mr-h .mr-lg i{font-size:1.8rem}
.mr-who{flex:1 1 auto;min-width:0}
.mr-who b{display:block;font-family:var(--head),var(--deva);font-weight:700;font-size:1.65rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-lead .mr-who b{font-size:2.1rem}
.mr-who small{display:block;font-size:1.3rem;color:var(--dim);margin-top:.2rem;white-space:nowrap}
.off .mr-who small{color:var(--gold);font-weight:700}
.mr-who small.mr-by{font-weight:700;letter-spacing:.02rem}
.mr-who small.mr-by.atk{color:#FF8A65} .mr-who small.mr-by.pro{color:var(--good)}
.mr-when{flex:0 0 auto;margin-left:1rem;display:flex;align-items:center;font-size:1.35rem;color:var(--muted);white-space:nowrap}
.mr-lead .mr-when{font-size:1.4rem}
.mr-when.fresh{color:#FFAB91;font-weight:700}
.mr-dot{display:inline-block;width:.75rem;height:.75rem;border-radius:50%;background:var(--live);margin-right:.55rem;animation:pulse 1.6s ease-out infinite}
body.reduced .mr-dot{animation:none}
.mr-t{flex:0 1 auto;margin-top:1.2rem;font-size:2.2rem;line-height:1.38;font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* the lead headline sits in the middle of the space left between the source row and the footer */
.mr-lead .mr-h{margin-bottom:2rem}
.mr-lead .mr-t{margin:auto 0;font-size:3.6rem;line-height:1.3;font-weight:600;-webkit-line-clamp:6}
.mr-w.n1 .mr-lead .mr-t{font-size:4.2rem}
.mr-w.n2 .mr-c:nth-child(2) .mr-t,.mr-w.n4 .mr-c:nth-child(4) .mr-t{-webkit-line-clamp:6}
.mr-f{flex:0 0 auto;margin-top:auto;padding-top:1rem;display:flex;align-items:center;min-width:0;font-size:1.3rem;color:var(--dim);white-space:nowrap;overflow:hidden}
.mr-lead .mr-f{margin-top:2rem;font-size:1.3rem;padding-top:1.4rem;border-top:.08rem solid rgba(255,200,87,.14)}
.mr-also{display:flex;align-items:center;min-width:0}
.mr-also .mr-lg{width:2.3rem;height:2.3rem;border-radius:.55rem;margin:0 0 0 -.6rem;box-shadow:0 0 0 .16rem #1f0803}
.mr-also .mr-lg:first-child{margin-left:0} .mr-also .mr-lg i{font-size:1.2rem}
.mr-lead .mr-also .mr-lg{width:2.9rem;height:2.9rem} .mr-lead .mr-also .mr-lg i{font-size:1.3rem}
.mr-also > span{margin-left:.8rem;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mr-vid{flex:0 0 auto;margin-left:auto;padding-left:1rem;display:flex;align-items:center;color:var(--muted)}
.mr-vid svg{width:1.3em;height:1.3em;margin-right:.35rem;fill:currentColor}
/* the topic title carries the area as a pill, like the state pill in the header */
.mr-area{display:inline-flex;align-items:center;vertical-align:.7rem;margin-left:1.4rem;padding:.4rem 1.3rem .4rem 1rem;border-radius:3rem;font-family:var(--deva);font-size:1.55rem;font-weight:700;
  line-height:1.3;background:linear-gradient(135deg,rgba(90,30,6,.96),rgba(40,12,4,.96));border:.08rem solid rgba(255,200,87,.6);color:#FFE3A3;text-shadow:none;
  box-shadow:0 .4rem 1.2rem rgba(0,0,0,.35)}            /* solid: it often sits over the bright leader photo */
.mr-area svg{width:1.5rem;height:1.5rem;fill:var(--gold);margin-right:.5rem}
/* "Up next" where the screen counter normally is */
.st-count.nx{font-family:var(--deva);font-size:1.45rem;color:var(--muted);max-width:44rem;overflow:hidden;text-overflow:ellipsis}
.st-count.nx b{font-family:var(--head);font-size:1.3rem;letter-spacing:.16rem;text-transform:uppercase;color:var(--gold);margin-right:.7rem}
/* latest by source: a column per source, its logo on top */
.mr-sg{display:grid;grid-gap:1.4rem;height:100%}
.mr-s{display:flex;flex-direction:column;min-height:0;min-width:0;padding:1.7rem 1.9rem;border-radius:1.6rem;overflow:hidden;
  background:linear-gradient(180deg,rgba(42,13,4,.92),rgba(24,7,2,.92));border:.08rem solid rgba(255,153,51,.2);box-shadow:0 1.6rem 3.4rem rgba(0,0,0,.4)}
.mr-sh{display:flex;align-items:center;margin-bottom:1rem;white-space:nowrap;min-width:0}
.mr-sh .mr-lg{width:4.2rem;height:4.2rem;border-radius:1rem;margin-right:1.2rem}
.mr-sh b{display:block;font-family:var(--head),var(--deva);font-size:2.2rem;line-height:1.1;color:var(--text);overflow:hidden;text-overflow:ellipsis}
.mr-sh small{display:block;font-size:1.3rem;color:var(--dim);margin-top:.2rem}
.mr-sh.off small{color:var(--gold);font-weight:700}
.mr-sh > div{min-width:0}
.mr-s ol{list-style:none;min-height:0;overflow:hidden}
.mr-s li{display:flex;padding:.75rem 0;border-top:.08rem solid rgba(255,153,51,.16)}
.mr-s li > i{flex:0 0 auto;width:2.2rem;font-style:normal;font-family:var(--head);font-weight:700;font-size:1.6rem;color:var(--gold);line-height:1.3}
.mr-s li > div{min-width:0}
.mr-s li a{color:var(--text);text-decoration:none;font-size:1.5rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mr-s li small{display:block;font-size:1.3rem;color:var(--dim);margin-top:.2rem}
.mr-s li small b{color:#fff;background:var(--live);padding:0 .4rem;border-radius:.3rem;margin-right:.4rem;font-size:1.2rem}
.mr-empty{font-size:1.5rem;color:var(--muted)}
/* the panel: opens when the show is paused (or "Topics" in the header); changes apply at once */
/* left: where (area) and how fast; right: topics in groups; footer: hint + Continue */
.mrp{position:fixed;top:8.6rem;right:3.4rem;z-index:30;width:78rem;max-width:calc(100% - 6.8rem);max-height:calc(100% - 15rem);display:flex;flex-direction:column;border-radius:1.8rem;overflow:hidden;
  background:linear-gradient(160deg,rgba(48,15,4,.98),rgba(24,7,2,.98));border:.1rem solid rgba(255,200,87,.45);box-shadow:0 2.4rem 6rem rgba(0,0,0,.7);
  -webkit-animation:rise .35s cubic-bezier(.2,.8,.2,1) both;animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.mrp-h{flex:0 0 auto;padding:1.5rem 2.2rem 1.2rem;border-bottom:.08rem solid var(--line);background:linear-gradient(90deg,rgba(230,81,0,.28),rgba(230,81,0,0) 70%)}
.mrp-h b{display:block;font-family:var(--deva);font-weight:800;font-size:2.3rem;line-height:1.1}
.mrp-h small{display:block;margin-top:.35rem;font-size:1.35rem;color:var(--gold);font-weight:700}
.mrp-body{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;align-items:flex-start;padding:.4rem 2.2rem 1rem}
.mrp-side{flex:0 0 22rem;margin-right:2.2rem;padding-right:2.2rem;border-right:.08rem solid var(--line)}
.mrp-main{flex:1 1 auto;min-width:0}
.mrp-k{font-family:var(--head),var(--deva);font-weight:700;font-size:1.3rem;letter-spacing:.14rem;text-transform:uppercase;color:var(--gold);margin:1.3rem 0 .7rem}
.mrp-row{display:flex;flex-wrap:wrap}
.mrp button.o{margin:0 .6rem .6rem 0;height:3.4rem;padding:0 1.2rem;border-radius:2rem;border:.08rem solid rgba(255,200,87,.25);background:rgba(255,255,255,.06);
  font-family:var(--deva);font-size:1.35rem;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--text)}
.mrp button.o:hover,.mrp button.o:focus{border-color:var(--gold);outline:none;background-color:rgba(255,153,51,.18)}
.mrp button.o:focus{box-shadow:0 0 0 .2rem var(--gold)}
.mrp button.o.on{background:linear-gradient(135deg,#E65100,#FF9933);border-color:transparent;color:#fff;box-shadow:0 .4rem 1.2rem rgba(230,81,0,.35)}
.mrp button.o.on:focus{box-shadow:0 0 0 .2rem #fff}
.mrp button.o.dim{opacity:.45}
/* a topic: a tick when on, a green "3 new" when it has fresh stories */
.mrp button.o .ck{display:inline-block;width:1.5rem;height:1.5rem;border-radius:50%;border:.14rem solid rgba(255,255,255,.4);margin-right:.6rem;vertical-align:-.25rem;position:relative}
.mrp button.o.on .ck{background:#fff;border-color:#fff}
.mrp button.o.on .ck:after{content:'';position:absolute;left:.42rem;top:.16rem;width:.38rem;height:.72rem;border:solid #E65100;border-width:0 .18rem .18rem 0;-webkit-transform:rotate(45deg);transform:rotate(45deg)}
.mrp button.o .fr{display:inline-block;margin-left:.6rem;padding:0 .55rem;border-radius:1rem;font-size:1.2rem;line-height:1.7rem;background:rgba(123,211,137,.18);color:var(--good)}
.mrp button.o.on .fr{background:rgba(255,255,255,.25);color:#fff}
.mrp button.o .fr:before{content:'';display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:currentColor;margin-right:.35rem;vertical-align:.1rem}
/* topic groups */
.mrp-g{margin-top:.2rem}
.mrp-gh{display:flex;align-items:center;margin:.9rem 0 .55rem}
.mrp-gh span{font-size:1.3rem;font-weight:700;color:var(--muted)}
.mrp-gh:after{content:'';flex:1 1 auto;height:.08rem;background:var(--line);margin-left:1rem}
.mrp button.ga{order:2;margin-left:1rem;height:2.4rem;padding:0 .9rem;border-radius:1.2rem;border:.08rem solid rgba(255,200,87,.3);background:transparent;color:var(--gold);
  font-family:var(--deva);font-size:1.3rem;font-weight:700;cursor:pointer;white-space:nowrap}
.mrp-gh:after{order:1}
.mrp button.ga:hover,.mrp button.ga:focus{outline:none;background:rgba(255,153,51,.18);border-color:var(--gold)}
/* area: one choice per line, like radio buttons */
.mrp-list button.o{display:block;width:100%;margin:0 0 .55rem;text-align:left;border-radius:1rem;overflow:hidden;text-overflow:ellipsis}
.mrp-list button.o .ck{border-radius:50%}
.mrp-list button.o.on .ck:after{left:.33rem;top:.33rem;width:.55rem;height:.55rem;border:0;border-radius:50%;background:#E65100;-webkit-transform:none;transform:none}
.mrp-list button.o.lnk{height:2.8rem;background:transparent;border-style:dashed;color:var(--gold);font-size:1.3rem}
/* speed: three equal parts */
.mrp-seg{display:flex;border-radius:1rem;border:.08rem solid rgba(255,200,87,.25);overflow:hidden;background:rgba(255,255,255,.04)}
.mrp-seg button.o{flex:1 1 0;margin:0;border:0;border-radius:0;padding:0 .4rem;text-align:center}
.mrp-seg button.o + button.o{border-left:.08rem solid rgba(255,200,87,.2)}
.mrp-note{margin-top:.55rem;font-size:1.3rem;color:var(--dim)}
.mrp-states{display:grid;grid-template-columns:1fr 1fr;grid-gap:.5rem;max-height:19rem;overflow-y:auto;margin-bottom:.6rem}
.mrp-states button.o{margin:0;width:100%;border-radius:.8rem;text-align:left;overflow:hidden;text-overflow:ellipsis;padding:0 .8rem;font-size:1.3rem}
.mrp-f{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:1.1rem 2.2rem;border-top:.08rem solid var(--line);background:rgba(0,0,0,.25)}

/* Hindi in a one-line box that clips (for the "..." of a long name): with a tight line-height the
